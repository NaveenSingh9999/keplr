<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
@font-face {
  font-family: "JetBrains Mono";
  src: url("/fonts/JetBrainsMono-Regular.ttf") format("truetype");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("/fonts/JetBrainsMono-Bold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}
:root {
  --bg: #000000;
  --surface: #000000;
  --surface2: #0D0D0F;
  --raised: #0D0D0F;
  --pressed: #1F1F22;
  --sep: rgba(255,255,255,.08);
  --border: rgba(255,255,255,.08);
  --text: #F5F5F7;
  --dim: #8D8D93;
  --text2: #8D8D93;
  --text3: #48484A;
  --accent: #0A84FF;
  --ok: #30D158;
  --warn: #FF9F0A;
  --error: #FF453A;
  --yellow: #FFD60A;
  --purple: #BF5AF2;
  --teal: #64D2FF;
  --syn-comment: #6C7986;
  --syn-keyword: #FC5FA3;
  --syn-string: #FC6A5D;
  --syn-number: #D0BF69;
  --syn-type: #5DD8FF;
  --syn-function: #67B7A4;
  --syn-macro: #FD8F3F;
  --syn-constant: #A167E6;
  --syn-plain: #F5F5F7;
  --overlay: rgba(22,22,24,.85);
  --overlay-blur: 24px;
  --on-accent: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --font-ui: -apple-system, "SF Pro Text", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs-cap: 11px;
  --fs-ui: 13px;
  --fs-code: 13px;
  --lh-code: 1.6;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --h-ctl: 28px;
  --ease: cubic-bezier(.32,.72,0,1);
  --d1: 150ms;
  --d2: 280ms;
}
  * { box-sizing: border-box; }
  * {
    scrollbar-width: thin;
    scrollbar-color: #2a3340 transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: #2a3340;
    border-radius: 8px;
    border: 2px solid #0e1116;
    min-height: 30px;
  }
  *::-webkit-scrollbar-thumb:hover { background: #58a6ff; border-color: transparent; }
  *::-webkit-scrollbar-corner { background: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* ---- titlebar ---- */
  #titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  #titlebar .logo { color: var(--accent); font-weight: bold; }
  #titlebar #root { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  #finder {
    flex: 1;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font: inherit;
    text-align: center;
  }
  #finder::placeholder { color: var(--dim); }
  #titlebar .spacer { flex: 1; }
  #titlebar input#token {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; font: inherit; width: 170px;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--error); }
  .iconbtn {
    background: none; border: none; color: var(--dim);
    font: inherit; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .iconbtn:hover, .iconbtn.on { color: var(--text); background: var(--border); }
  /* ---- workbench ---- */
  #workbench { display: flex; flex: 1; min-height: 0; }
  .dock { background: var(--surface); display: flex; flex-direction: column; min-height: 0; flex: none; }
  .dock.hidden { display: none; }
  #left { width: 270px; border-right: 1px solid var(--border); resize: horizontal; overflow: auto; min-width: 170px; max-width: 480px; }
  #right { width: 230px; border-left: 1px solid var(--border); resize: horizontal; overflow: auto; min-width: 150px; max-width: 420px; direction: rtl; }
  #right > * { direction: ltr; }
  .docktabs { display: flex; gap: 2px; padding: 6px 8px 0; flex: none; }
  .docktabs button {
    background: none; border: none; color: var(--dim);
    font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .docktabs button.sel { color: var(--text); border-bottom-color: var(--accent); }
  .dockbody { flex: 1; overflow: auto; padding: 4px 4px 10px; min-height: 0; }
  /* file tree */
  .tnode { user-select: none; }
  .trow {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trow:hover { background: var(--border); }
  .trow.sel { background: var(--border); color: var(--accent); }
  .trow svg { flex: none; }
  .tkids { margin-left: 14px; }
  .tkids.closed { display: none; }
  .tri { color: var(--dim); font-size: 10px; width: 12px; flex: none; text-align: center; }
  /* ---- center ---- */
  #center { flex: 1; display: flex; min-width: 0; background: var(--bg); }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  .col:last-child { border-right: none; }
  .col.hidden { display: none; }
  .col.focus { border-color: var(--accent); }
  #tabsbar {
    display: flex; align-items: stretch; gap: 2px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 4px 8px 0; overflow-x: auto; flex: none;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px 5px 12px; cursor: pointer; white-space: nowrap;
    color: var(--dim); border-bottom: 2px solid transparent; font-size: 12px;
  }
  .tab.sel { color: var(--text); border-bottom-color: var(--accent); background: var(--bg); border-radius: 6px 6px 0 0; }
  .tab .dirty { color: var(--warn); }
  .tab .x { color: var(--dim); border-radius: 4px; padding: 0 4px; }
  .tab .x:hover { color: var(--error); background: var(--border); }
  #crumbs { padding: 5px 14px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); flex: none; }
  #crumbs b { color: var(--text); font-weight: normal; }
  #editorwrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  #editorwrap .cm-editor { height: 100%; }
  #editorwrap .cm-scroller { overflow: auto; }
  #previewwrap { flex: 1; min-height: 0; overflow: auto; display: none; background: var(--bg); }
  #previewwrap.on { display: block; }
  #previewwrap iframe.doc { width: 100%; height: 100%; border: none; background: #525659; }
  #previewwrap img.doc { max-width: 100%; display: block; margin: 16px auto; background:
    repeating-conic-gradient(#1a212b 0 25%, #141a21 0 50%) 0 0 / 20px 20px; }
  .md { max-width: 860px; margin: 0 auto; padding: 24px 32px 60px; line-height: 1.65; font-size: 14px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 1.2em 0 .5em; line-height: 1.3; }
  .md h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .md h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .md p { margin: .7em 0; }
  .md a { color: var(--accent); }
  .md code { background: var(--surface2); padding: .1em .35em; border-radius: 4px; font-size: .92em; }
  .md pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md .codelang { color: var(--dim); font-size: 11px; display: block; margin-bottom: 6px; }
  .md blockquote { border-left: 3px solid var(--accent); margin: .7em 0; padding: .1em 0 .1em 1em; color: var(--dim); }
  .md blockquote blockquote { margin: .3em 0; }
  .md ul, .md ol { margin: .5em 0; padding-left: 1.6em; }
  .md li { margin: .25em 0; }
  .md li.task { list-style: none; margin-left: -1.6em; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .md table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .md th { background: var(--surface); }
  .md img { max-width: 100%; }
  .md del { color: var(--dim); }
  #crumbs .vtoggle { float: right; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 4px; font: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer; }
  #crumbs .vtoggle.on { color: var(--accent); border-color: var(--accent); }
  #fallback {
    display: none; width: 100%; height: 100%; background: var(--bg); color: var(--text);
    border: none; outline: none; resize: none; padding: 8px 12px;
    font: inherit; line-height: 1.55; white-space: pre;
  }
  /* ---- bottom dock ---- */
  #bottom { height: 190px; flex: none; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; resize: vertical; overflow: auto; min-height: 90px; max-height: 60vh; }
  #bottom.hidden { display: none; }
  #bbody { flex: 1; overflow: auto; padding: 6px 14px; min-height: 0; }
  #bbody .hit { cursor: pointer; padding: 2px 0; }
  #bbody .hit:hover { color: var(--accent); }
  #bbody .task { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  #bbody .task button {
    background: var(--border); color: var(--text); border: none;
    border-radius: 4px; font: inherit; padding: 2px 10px; cursor: pointer;
  }
  #bbody pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); }
  #bbody .prob { cursor: pointer; padding: 2px 0; }
  #bbody .prob:hover { color: var(--accent); }
  #bbody .logline { padding: 1px 0; color: var(--dim); }
  #termholder canvas { display: block; outline: none; cursor: text; }
  /* ---- statusbar ---- */
  #statusbar {
    display: flex; gap: 14px; padding: 4px 12px; flex: none;
    background: var(--surface); border-top: 1px solid var(--border);
    color: var(--dim); font-size: 12px; align-items: center;
  }
  #statusbar .right { margin-left: auto; display: flex; gap: 14px; }
  .err { color: var(--error); }
  /* ---- palette ---- */
  #palwrap {
    display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(560px, 90vw); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; z-index: 10;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); overflow: hidden;
  }
  #palwrap.open { display: block; }
  #palinput {
    width: 100%; background: transparent; color: var(--text);
    border: none; outline: none; padding: 10px 14px; font: inherit; font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  #palist { max-height: 300px; overflow: auto; padding: 4px; }
  #palist div { padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  #palist div.sel { background: var(--border); color: var(--accent); }
  #palist .cmd { color: var(--dim); font-size: 12px; margin-left: 8px; }
  /* ---- context menu ---- */
  #ctxmenu {
    display: none; position: fixed; z-index: 20; min-width: 220px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  #ctxmenu.open { display: block; }
  #ctxmenu .mi {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  #ctxmenu .mi:hover { background: var(--border); }
  #ctxmenu .mi.danger { color: var(--error); }
  #ctxmenu .mi.danger:hover { background: #3d1d1d; }
  #ctxmenu .mi .k { margin-left: auto; color: var(--dim); font-size: 11px; }
  #ctxmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
  /* ---- modal ---- */
  #modalwrap {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.5);
    align-items: flex-start; justify-content: center; padding-top: 18vh;
  }
  #modalwrap.open { display: flex; }
  #modal {
    width: min(420px, 90vw);
    background: var(--overlay); -webkit-backdrop-filter: blur(var(--overlay-blur)); backdrop-filter: blur(var(--overlay-blur));
    border: 1px solid var(--sep);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 24px 70px rgba(0,0,0,.65);
    border-radius: var(--r-lg); padding: 18px;
  }
  #modalwrap.open #modal { animation: kpal-in var(--d2) var(--ease); }
  #modal h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  #modal input, #modal textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; outline: none;
  }
  #modal input:focus, #modal textarea:focus { border-color: var(--accent); }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #modal button {
    background: var(--border); color: var(--text); border: none;
    border-radius: 6px; font: inherit; padding: 5px 14px; cursor: pointer;
  }
  #modal button.primary { background: var(--accent); color: #04101f; font-weight: bold; }
  #modal button.danger { background: var(--error); color: #fff; font-weight: bold; }
  /* ---- source control ---- */
  #scm { display: flex; flex-direction: column; height: 100%; gap: 8px; }
  #scm textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; outline: none; resize: vertical; min-height: 56px;
  }
  #scm textarea:focus { border-color: var(--accent); }
  #scm .commitbtn {
    background: var(--accent); color: #04101f; border: none; font-weight: bold;
    border-radius: 6px; font: inherit; padding: 6px; cursor: pointer;
  }
  #scm .commitbtn:disabled { opacity: .45; cursor: default; }
  #scm h4 { margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: normal; display: flex; align-items: center; gap: 6px; }
  #scm h4 .n { background: var(--border); border-radius: 8px; padding: 0 7px; font-size: 11px; }
  #scm h4 button { margin-left: auto; }
  #scm .mini {
    background: none; border: none; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 1px 6px; border-radius: 4px;
  }
  #scm .mini:hover { color: var(--text); background: var(--border); }
  #scm .filerow {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  #scm .filerow:hover { background: var(--border); }
  #scm .filerow .badge {
    font-size: 11px; width: 14px; flex: none; text-align: center; font-weight: bold;
  }
  #scm .filerow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scm .filerow .act { display: none; gap: 2px; }
  #scm .filerow:hover .act { display: flex; }
  #scm .filerow .act button {
    background: none; border: none; color: var(--dim);
    font: inherit; cursor: pointer; padding: 0 5px; border-radius: 4px; font-size: 13px;
  }
  #scm .filerow .act button:hover { color: var(--text); background: var(--surface2); }
  #scm select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; font: inherit; max-width: 100%;
  }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button { transition: background-color var(--d1), color var(--d1); }
  .trow, .tab, #files div { transition: background-color var(--d1); }
  /* ---- suggest widget (inline completions) ---- */
  #suggest {
    display: none; position: fixed; z-index: 25; min-width: 240px; max-width: 380px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px; box-shadow: 0 12px 40px rgba(0,0,0,.55);
    animation: pop var(--d1) ease-out;
  }
  #suggest.open { display: block; }
  #suggest .sg {
    display: flex; gap: 10px; align-items: baseline;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  #suggest .sg.sel { background: var(--accent); color: #fff; }
  #suggest .sg.sel .desc { color: rgba(255,255,255,.75); }
  #suggest .sg .pre { font-weight: bold; }
  #suggest .sg .desc { color: var(--dim); font-size: 11px; margin-left: auto; }
  /* ---- settings panel ---- */
  #settingswrap {
    display: none; position: fixed; top: 0; right: 0; bottom: 0; z-index: 22;
    width: min(380px, 92vw); background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -12px 0 40px rgba(0,0,0,.5);
    flex-direction: column;
    animation: slidein var(--d2) ease-out;
  }
  #settingswrap.open { display: flex; }
  #settingswrap header {
    display: flex; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  #settingswrap header button { margin-left: auto; }
  #settingsbody { overflow-y: auto; padding: 8px 16px 24px; }
  #settingsbody h4 {
    margin: 14px 0 4px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--dim); font-weight: normal;
  }
  #settingsbody .row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--surface2);
  }
  #settingsbody .row label { flex: 1; }
  #settingsbody .row .hint { display: block; font-size: 11px; color: var(--dim); }
  #settingsbody input[type="range"] { width: 110px; accent-color: var(--accent); }
  #settingsbody input[type="number"] {
    width: 70px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit;
  }
  #settingsbody select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit;
  }
  #settingsbody input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  #settingsbody .val { color: var(--dim); font-size: 11px; min-width: 34px; text-align: right; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; } }
  @keyframes slidein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #palwrap.open, #modalwrap.open, #ctxmenu.open { animation: pop var(--d1) ease-out; }
  #leftbody, #bbody, #symbols, #files { scroll-behavior: smooth; }
  #smsg { transition: opacity var(--d2); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #leftbody, #bbody, #symbols, #files { scroll-behavior: auto; }
  }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  body.noanim #leftbody, body.noanim #bbody, body.noanim #symbols, body.noanim #files { scroll-behavior: auto; }
  body.noblink .cm-cursor, body.noblink .cm-fat-cursor { animation: none !important; }
  body.calm .cm-cursor, body.calm .cm-fat-cursor { animation: none !important; }
  body.calm #leftbody, body.calm #bbody, body.calm #symbols, body.calm #files { scroll-behavior: auto; }

  /* ============ KEPLR DESIGN SYSTEM (native primitives) ============ */
  html { color-scheme: dark; }
  body {
    font: 400 var(--fs-ui)/1.45 var(--font-ui);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *:hover { scrollbar-color: rgba(255,255,255,.16) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-track { background: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: var(--r-sm); }
  @supports (corner-shape: squircle) {
    .kbtn, .kmenu, .kinput, .ktoast, .kseg, #palwrap, #findcard { corner-shape: squircle; }
  }
  @media (pointer: coarse) {
    .kbtn, .kinput, select.kinput { min-height: 44px; }
    .kicon { width: 44px; height: 44px; }
  }
  .ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
  .fic { width: 15px; height: 15px; flex: none; fill: currentColor; }
  .kbtn {

<script type="module">
import { EditorView, basicSetup } from "codemirror";
import { EditorState, Compartment } from "@codemirror/state";
import { oneDark } from "@codemirror/theme-one-dark";
import { keymap } from "@codemirror/view";
import * as PaneLayout from "/ui-layout.js";

/* ============ transport ============ */
let token = "";
let wsRoot = "";
function url(path) {
  const q = token ? ((path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token)) : "";
  return path + q;
}
async function get(path) {
  const r = await fetch(url(path));
  if (r.status === 401) { openUnlock(); throw new Error("locked — unlock to continue"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(url(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (r.status === 401) { openUnlock(); throw new Error("locked — unlock to continue"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
/* Token gating without a permanent input: Unlock sheet on 401,
   remembered per host. */
function tokenKey() { return "keplr-token-" + location.host; }
let unlockOpen = false;
function updateLock() {
  const b = document.getElementById("slockbtn");
  if (b) b.classList.toggle("on", !!token);
}
function openUnlock() {
  if (unlockOpen) return;
  unlockOpen = true;
  const wrap = document.getElementById("modalwrap");
  const modal = document.getElementById("modal");
  modal.innerHTML = "";
  const h = document.createElement("h3");
  h.textContent = "Unlock workspace";
  const p = document.createElement("p");
  p.textContent = "This server is token-gated. Paste the token once — it stays on this host.";
  p.style.cssText = "color:var(--text2);font-size:13px;margin:0 0 10px;";
  const input = document.createElement("input");
  input.type = "password";
  input.className = "kinput";
  input.placeholder = "token";
  input.style.width = "100%";
  input.autocomplete = "off";
  const lab = document.createElement("label");
  lab.style.cssText = "display:flex;gap:8px;align-items:center;color:var(--text2);font-size:13px;margin:10px 0;";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.className = "kswitch";
  box.checked = true;
  lab.appendChild(box);
  lab.appendChild(document.createTextNode("Remember on this host"));
  const row = document.createElement("div");
  row.className = "row";
  row.style.justifyContent = "flex-end";
  const cancel = document.createElement("button");
  cancel.className = "kbtn";
  cancel.textContent = "Cancel";
  const ok = document.createElement("button");
  ok.className = "kbtn kbtn-acc";
  ok.textContent = "Unlock";
  const close = () => {
    wrap.classList.remove("open");
    wrap.onclick = null;
    unlockOpen = false;
  };
  ok.onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    token = v;
    try {
      if (box.checked) localStorage.setItem(tokenKey(), token);
      else localStorage.removeItem(tokenKey());
    } catch (e) {}
    updateLock();
    close();
    health();
    loadFiles();
  };
  cancel.onclick = close;
  input.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); ok.onclick(); }
    else if (e.key === "Escape") close();
    e.stopPropagation();
  };
  row.appendChild(cancel);
  row.appendChild(ok);
  modal.appendChild(h);
  modal.appendChild(p);
  modal.appendChild(input);
  modal.appendChild(lab);
  modal.appendChild(row);
  wrap.classList.add("open");
  wrap.onclick = e => { if (e.target === wrap) close(); };
  input.focus();
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function rel(p) {
  if (wsRoot && (p === wsRoot || p.startsWith(wsRoot + "/"))) {
    return p.slice(wsRoot.length + 1) || p;
  }
  return p;
}

/* ============ file icons (Seti UI pack, inlined, MIT) ============ */
/* Per-language glyphs from the Seti file-icon set (the same family VS Code
   ships), inlined into the sprite below as f-*. Folders share f-folder. */
const SETI = {
  rust: "f-rust", python: "f-python", javascript: "f-javascript", jsx: "f-javascript",
  typescript: "f-typescript", tsx: "f-typescript", cpp: "f-cpp", cc: "f-cpp",
  cxx: "f-cpp", h: "f-cpp", hpp: "f-cpp", c: "f-c", csharp: "f-c-sharp",
  go: "f-go", java: "f-java", kotlin: "f-kotlin", swift: "f-swift",
  ruby: "f-ruby", php: "f-php", html: "f-html", htm: "f-html", css: "f-css",
  json: "f-json", toml: "f-config", yaml: "f-yml", yml: "f-yml",
  markdown: "f-markdown", shell: "f-shell", sh: "f-shell", bash: "f-shell",
  sql: "f-db", lua: "f-lua", laml: "f-default", text: "f-default",
};
function setiIcon(id) {
  return `<svg class="fic" aria-hidden="true"><use href="#${id}"></use></svg>`;
}
function fileIconFor(path) {
  const k = previewKind(path);
  if (k === "pdf") return setiIcon("f-pdf");
  if (k === "img") return setiIcon("f-image");
  return setiIcon(SETI[langOf(path)] || "f-default");
}
/* Design-system icon: <use> from the sprite. Usage: icon("search") */
function icon(name, cls) {
  return `<svg class="ic ${cls || ""}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

/* ============ state ============ */
const S = {
  groups: [{tabs: [], active: -1}],
  focus: 0,
  files: [],           // rel paths
  leftTab: "project",
  bottomTab: "search",
  problems: [],
  palSel: 0,
  palItems: [],
  palSearch: [],
  symCache: null,
  gitStatus: {},
  cursorLine: 1,
  marks: null,
  searchQuery: "",
  log: [],
  docks: { left: true, right: false, bottom: false },
  layout: { left: 264, right: 232, bottom: 192 },
  paneLayout: null,
  paneReady: false,
  paneSurface: null,
  paneHostCards: new Map(),
  paneHosts: new Map(),
  paneDrag: null,
  panePresets: {},
};
function G() { return S.groups[S.focus]; }
function A() { const g = G(); return g.tabs[g.active] || null; }
function saveLayout() {
  try {
    const value = S.paneReady && S.paneLayout
      ? { version: 2, pane: S.paneLayout, docks: S.docks, layout: S.layout }
      : { docks: S.docks, layout: S.layout };
    localStorage.setItem("keplr-layout", JSON.stringify(value));
  } catch (e) {}
}
function loadLayout() {
  try {
    const l = JSON.parse(localStorage.getItem("keplr-layout") || "null");
    if (l) {
      if (l.docks) S.docks = Object.assign(S.docks, l.docks);
      if (l.layout) S.layout = Object.assign(S.layout, l.layout);
      if (l.pane) {
        try { S.paneLayout = PaneLayout.deserialize(l.pane); }
        catch (e) { S.paneLayout = PaneLayout.migrateLegacyLayout(l); }
      } else {
        S.paneLayout = PaneLayout.migrateLegacyLayout(l);
      }
    } else {
      S.paneLayout = PaneLayout.migrateLegacyLayout(l);
    }
  } catch (e) {
    S.paneLayout = PaneLayout.currentLayout();
  }
}
function paneApplyLegacySizes() {
  if (!S.paneLayout) return;
  const width = Math.max(720, window.innerWidth || 1200);
  const height = Math.max(480, window.innerHeight || 800);
  const left = Math.max(72, Math.min(0.45, (S.layout.left || 264) / width));
  const right = Math.max(0.12, Math.min(0.35, (S.layout.right || 232) / Math.max(1, width - (S.layout.left || 264))));
  const bottom = Math.max(0.12, Math.min(0.55, (S.layout.bottom || 192) / Math.max(1, height - 60)));
  for (const [id, ratio] of [["split-root", 1 - bottom], ["split-top", left], ["split-center", 1 - right]]) {
    try { S.paneLayout = PaneLayout.setSplitRatio(S.paneLayout, id, ratio); } catch (e) {}
  }
}
const PANE_CARD_HOSTS = {
  "files-default": "left",
  "search-default": "bottom",
  "source-default": "left",
  "outline-default": "left",
  "editor-default": "center",
  "symbols-default": "right",
  "terminal-default": "bottom",
  "problems-default": "bottom",
  "tasks-default": "bottom",
  "console-default": "bottom",
  "serial-default": "bottom",
};
const PANE_CARD_ICONS = {
  files: "file",
  editor: "file",
  outline: "list",
  search: "search",
  "source-control": "branch",
  problems: "xcirc",
  tasks: "play",
  console: "list",
  terminal: "terminal",
  serial: "activity",
  chat: "info",
};
const PANE_FALLBACK_HOSTS = {
  files: "left",
  search: "bottom",
  "source-control": "left",
  outline: "right",
  editor: "center",
  terminal: "bottom",
  problems: "bottom",
  tasks: "bottom",
  console: "bottom",
  serial: "bottom",
};
function paneCardHost(card) {
  const id = S.paneHostCards.get(card.id) || PANE_CARD_HOSTS[card.id] || PANE_FALLBACK_HOSTS[card.kind];
  return id ? S.paneHosts.get(id) || document.getElementById(id) : null;
}
function paneCardIcon(kind) { return icon(PANE_CARD_ICONS[kind] || "file"); }
function paneCardTitle(card) { return card.title || card.kind; }
function paneActiveCard(leafId) {
  const leaf = S.paneLayout && S.paneLayout.tree.leaves[leafId];
  if (!leaf) return null;
  return leaf.cards.find(card => card.id === leaf.activeCard) || leaf.cards[0] || null;
}
function paneSyncCardView(card) {
  if (!card) return;
  if (card.kind === "files") setLeftTab("project");
  else if (card.kind === "source-control") setLeftTab("source");
  else if (card.kind === "search") setBottomTab("search", false, true);
  else if (["terminal", "problems", "tasks", "console", "serial"].includes(card.kind)) {
    const tab = card.kind === "console" ? "console" : card.kind;
    setBottomTab(tab, false, true);
  }
}
function paneSetCardActive(leafId, cardId) {
  try {
    S.paneLayout = PaneLayout.setCardActive(S.paneLayout, leafId, cardId);
    saveLayout();
    renderPaneLayout();
    paneSyncCardView(paneActiveCard(leafId));
  } catch (e) { msg(String(e), true); }
}
function paneBuildLeaf(leaf, node) {
  node.className = "pane-node pane-leaf";
  node.dataset.leafId = leaf.id;
  node.setAttribute("role", "group");
  node.setAttribute("aria-label", leaf.id);
  const bar = document.createElement("div");
  bar.className = "pane-cardbar";
  bar.setAttribute("role", "tablist");
  bar.setAttribute("aria-label", leaf.id + " cards");
  const content = document.createElement("div");
  content.className = "pane-content";
  for (const card of leaf.cards) {
    const tab = document.createElement("button");
    tab.className = "pane-card" + (card.id === leaf.activeCard ? " sel" : "");
    tab.dataset.cardId = card.id;
    tab.dataset.leafId = leaf.id;
    tab.draggable = true;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", card.id === leaf.activeCard ? "true" : "false");
    tab.title = paneCardTitle(card);
    tab.setAttribute("data-tip", paneCardTitle(card));
    tab.innerHTML = paneCardIcon(card.kind) + '<span class="pane-card-label"></span>';
    tab.querySelector(".pane-card-label").textContent = paneCardTitle(card);
    const close = document.createElement("span");
    close.className = "pane-card-close";
    close.textContent = "×";
    close.title = "Close card";
    close.setAttribute("data-tip", "Close card");
    close.onclick = e => {
      e.stopPropagation();
      try { S.paneLayout = PaneLayout.removeCardFromLayout(S.paneLayout, card.id); saveLayout(); renderPaneLayout(); }
      catch (err) { msg(String(err), true); }
    };
    tab.appendChild(close);
    tab.onclick = () => paneSetCardActive(leaf.id, card.id);
    tab.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); paneCardMenu(e, leaf.id, card.id); };
    paneWireCardDrag(tab, leaf.id, card.id);
    bar.appendChild(tab);
  }
  node.appendChild(bar);
  node.appendChild(content);
  node._paneLeaf = leaf;
  node._paneContent = content;
  return node;
}
function paneBuildNode(model, parent) {
  const node = document.createElement("div");
  node.className = "pane-node";
  if (model.type === "leaf") {
    paneBuildLeaf(model, node);
    parent.appendChild(node);
    return node;
  }
  node.className = "pane-node pane-split";
  node.dataset.splitId = model.id;
  node.dataset.axis = model.axis;
  const first = document.createElement("div");
  first.className = "pane-node pane-child";
  const second = document.createElement("div");
  second.className = "pane-node pane-child";
  first.style.flex = String(model.ratio);
  second.style.flex = String(1 - model.ratio);
  const firstNode = paneBuildNode(model.first, first);
  const secondNode = paneBuildNode(model.second, second);
  const splitter = document.createElement("div");
  splitter.className = "pane-splitter";
  splitter.dataset.axis = model.axis;
  splitter.dataset.splitId = model.id;
  paneWireSplitter(splitter, model, first, second);
  node.appendChild(first);
  node.appendChild(splitter);
  node.appendChild(second);
  parent.appendChild(node);
  node._paneFirst = first;
  node._paneSecond = second;
  node._paneSplitter = splitter;
  return node;
}
function paneWireCardDrag(tab, leafId, cardId) {
  tab.addEventListener("dragstart", e => {
    S.paneDrag = { cardId, leafId };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/keplr-card", cardId);
    tab.classList.add("dragging");
  });
  tab.addEventListener("dragend", () => {
    S.paneDrag = null;
    tab.classList.remove("dragging");
    document.querySelectorAll(".pane-drop-before,.pane-drop-after,.pane-drop-target").forEach(el => el.classList.remove("pane-drop-before", "pane-drop-after", "pane-drop-target"));
  });
  tab.addEventListener("dragover", e => {
    if (!S.paneDrag) return;
    e.preventDefault();
    e.stopPropagation();
    tab.classList.add("pane-drop-before");
  });
  tab.addEventListener("dragleave", () => tab.classList.remove("pane-drop-before"));
  tab.addEventListener("drop", e => {
    e.preventDefault();
    e.stopPropagation();
    if (S.paneDrag) paneMoveCard(S.paneDrag.cardId, leafId);
  });
}
function paneWireSplitter(splitter, model, first, second) {
  splitter.addEventListener("pointerdown", e => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("dragging");
    const rect = splitter.parentElement.getBoundingClientRect();
    const start = model.axis === "horizontal" ? e.clientX : e.clientY;
    const total = model.axis === "horizontal" ? rect.width : rect.height;
    const move = ev => {
      const now = model.axis === "horizontal" ? ev.clientX : ev.clientY;
      const ratio = Math.max(0.08, Math.min(0.92, (now - start + (model.ratio * total)) / total));
      first.style.flex = String(ratio);
      second.style.flex = String(1 - ratio);
      splitter.parentElement.dataset.dragRatio = String(ratio);
    };
    const up = ev => {
      splitter.releasePointerCapture(ev.pointerId);
      splitter.classList.remove("dragging");
      const ratio = Number(splitter.parentElement.dataset.dragRatio || model.ratio);
      try { S.paneLayout = PaneLayout.setSplitRatio(S.paneLayout, model.id, ratio); } catch (err) {}
      delete splitter.parentElement.dataset.dragRatio;
      saveLayout();
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
}
function paneSyncContent() {
  const occupied = new Set();
  for (const leaf of Object.values(S.paneLayout.tree.leaves)) {
    const node = S.paneSurface.querySelector(`[data-leaf-id="${CSS.escape(leaf.id)}"]`);
    if (!node || !leaf.visible) continue;
    const card = paneActiveCard(leaf.id);
    const content = node._paneContent;
    content.replaceChildren();
    if (!card) {
      const empty = document.createElement("div");
      empty.className = "pane-card-placeholder";
      empty.innerHTML = "<div><strong>Empty pane</strong>Drop a card here or add one from Layout.</div>";
      content.appendChild(empty);
      continue;
    }
    const host = paneCardHost(card);
    if (host && !occupied.has(host)) {
      occupied.add(host);
      host.classList.remove("hidden");
      content.appendChild(host);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "pane-card-placeholder";
      placeholder.innerHTML = host
        ? `<div><strong>${esc(paneCardTitle(card))}</strong>This card is hosted by another pane.</div>`
        : `<div><strong>${esc(paneCardTitle(card))}</strong>Generic view surface</div>`;
      content.appendChild(placeholder);
    }
  }
}
function renderPaneLayout() {
  if (!S.paneReady || !S.paneSurface || !S.paneLayout) return;
  S.paneSurface.replaceChildren();
  paneBuildNode(S.paneLayout.tree.root, S.paneSurface);
  for (const leaf of Object.values(S.paneLayout.tree.leaves)) {
    S.docks[leaf.id] = !!leaf.visible;
    const node = S.paneSurface.querySelector(`[data-leaf-id="${CSS.escape(leaf.id)}"]`);

/* ============ terminal (canvas, alacritty_terminal grid) ============ */
const TERM = { sessions: [], active: -1, n: 0, strip: null, holder: null, toolbar: null, query: "", cellW: 8, cellH: 16, font: "", accent: "#0A84FF", accentSoft: "rgba(10,132,255,.28)" };

function termActive() {
  if (TERM.active < 0 || TERM.active >= TERM.sessions.length) return null;
  return TERM.sessions[TERM.active];
}

function termFont(px) {
  return px + 'px "SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace';
}

function termMeasure() {
  const px = (S.settings && S.settings.terminalFontSize) || 13;
  const c = document.createElement("canvas").getContext("2d");
  c.font = termFont(px);
  TERM.cellW = Math.max(5, Math.ceil(c.measureText("M").width));
  TERM.cellH = Math.ceil(px * 1.4);
  TERM.font = termFont(px);
}
window.__termRefresh = function () {
  const s = termActive();
  if (!s || !s.canvas) return;
  termMeasure();
  if (s.socket && s.socket.readyState === 1) {
    const d = termDims();
    s.socket.send("resize:" + d.cols + "x" + d.rows);
  }
  if (s.grid && TERM.sessions[TERM.active] === s) termDraw();
};

function termDims() {
  const holder = TERM.holder && TERM.holder.isConnected ? TERM.holder : document.getElementById("bbody");
  const w = Math.max(80, holder.clientWidth - 24);
  const h = Math.max(60, holder.clientHeight - 24);
  return {
    cols: Math.max(20, Math.floor(w / TERM.cellW)),
    rows: Math.max(5, Math.floor(h / TERM.cellH)),
    w: w,
    h: h
  };
}

function termDraw() {
  const s = termActive();
  if (!s || !s.ctx || !s.grid) return;
  const g = s.grid;
  const ctx = s.ctx;
  const cv = s.canvas;
  const dpr = window.devicePixelRatio || 1;
  const W = g.cols * TERM.cellW, H = g.rows * TERM.cellH;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  if (s.scrollOffset > 0 && s.history && s.history.length) {
    ctx.font = TERM.font;
    ctx.textBaseline = "top";
    const end = Math.max(0, s.history.length - s.scrollOffset);
    const start = Math.max(0, end - g.rows);
    ctx.fillStyle = "#F5F5F7";
    for (let i = start; i < end; i++) {
      const text = (s.history[i] || "").slice(0, g.cols);
      ctx.fillText(text, 0, (i - start) * TERM.cellH + 1);
    }
    return;
  }
  ctx.font = TERM.font;
  ctx.textBaseline = "top";
  for (let l = 0; l < g.rows; l++) {
    const row = g.cells[l];
    if (!row) continue;
    for (let c = 0; c < g.cols; c++) {
      const cell = row[c];
      if (!cell) continue;
      const x = c * TERM.cellW, y = l * TERM.cellH;
      const ch = cell[0], fg = cell[1], bg = cell[2], fl = cell[3];
      let fgc = fg || "#F5F5F7";
      let bgc = bg;
      if (fl & 4) { const t = fgc; fgc = bgc || "#000000"; bgc = t === "#F5F5F7" ? null : t; }
      if (bgc) { ctx.fillStyle = bgc; ctx.fillRect(x, y, TERM.cellW, TERM.cellH); }
      if (ch && ch !== " ") {
        ctx.fillStyle = fgc;
        if (fl & 1) ctx.font = "bold " + TERM.font;
        else if (fl & 2) ctx.font = "italic " + TERM.font;
        else ctx.font = TERM.font;
        ctx.fillText(ch, x, y + 1);
      }
    }
  }
  if (s.sel && s.sel.active) {
    const x0 = Math.min(s.sel.ax, s.sel.fx), x1 = Math.max(s.sel.ax, s.sel.fx);
    const y0 = Math.min(s.sel.ay, s.sel.fy), y1 = Math.max(s.sel.ay, s.sel.fy);
    ctx.fillStyle = TERM.accentSoft || "rgba(10,132,255,.28)";
    for (let l = y0; l <= y1 && l < g.rows; l++) {
      const c0 = l === y0 ? x0 : 0;
      const c1 = l === y1 ? x1 : g.cols - 1;
      ctx.fillRect(c0 * TERM.cellW, l * TERM.cellH, (c1 - c0 + 1) * TERM.cellW, TERM.cellH);
    }
  }
  if (TERM.query) {
    const needle = TERM.query.toLowerCase();
    for (let l = 0; l < g.rows; l++) {
      const row = g.cells[l] || [];
      let line = "";
      for (const cell of row) line += cell && cell[0] ? cell[0] : " ";
      let from = 0;
      let at = line.toLowerCase().indexOf(needle, from);
      while (at >= 0) {
        ctx.fillStyle = "rgba(255,214,10,.24)";
        ctx.fillRect(at * TERM.cellW, l * TERM.cellH, Math.max(TERM.cellW, needle.length * TERM.cellW), TERM.cellH);
        from = at + Math.max(1, needle.length);
        at = line.toLowerCase().indexOf(needle, from);
      }
    }
  }
  if (g.show) {
    const cl = Math.min(g.cursor[0], g.rows - 1), cc = Math.min(g.cursor[1], g.cols - 1);
    ctx.fillStyle = TERM.accent || "#0A84FF";
    ctx.fillRect(cc * TERM.cellW, cl * TERM.cellH, TERM.cellW, TERM.cellH);
    const cell = (g.cells[cl] || [])[cc];
    if (cell && cell[0] && cell[0] !== " ") {
      ctx.fillStyle = "#000000";
      ctx.font = TERM.font;
      ctx.fillText(cell[0], cc * TERM.cellW, cl * TERM.cellH + 1);
    }
  }
}

function termSend(data) {
  const s = termActive();
  if (!s) return;
  if (s.sel) { s.sel = null; termDraw(); }
  if (s.socket && s.socket.readyState === 1) s.socket.send(data);
}
function termCopySel() {
  const s = termActive();
  if (!s || !s.sel || !s.grid) { msg("nothing selected"); return; }
  const x0 = Math.max(0, Math.min(s.sel.ax, s.sel.fx)), x1 = Math.max(x0, Math.max(s.sel.ax, s.sel.fx));
  const y0 = Math.max(0, Math.min(s.sel.ay, s.sel.fy)), y1 = Math.max(y0, Math.max(s.sel.ay, s.sel.fy));
  const out = [];
  for (let l = y0; l <= y1 && l < s.grid.rows; l++) {
    const row = s.grid.cells[l] || [];
    const c0 = l === y0 ? x0 : 0;
    const c1 = l === y1 ? Math.min(x1, s.grid.cols - 1) : s.grid.cols - 1;
    let t = "";
    for (let c = c0; c <= c1; c++) t += (row[c] && row[c][0]) || " ";
    out.push(t.replace(/\s+$/, ""));
  }
  copyText(out.join("\n"));
  s.sel = null;
  termDraw();
  msg("copied " + out.join("\n").length + " chars");
}

function termKey(e) {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); termSearchOpen(); return; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); termClear(); return; }
  if (e.key === "Escape" && TERM.query) { e.preventDefault(); TERM.query = ""; termDraw(); return; }
  if (e.key === "Control" || e.key === "Shift" || e.key === "Alt" || e.key === "Meta") return;
  e.preventDefault();
  const k = e.key, ctrl = e.ctrlKey || e.metaKey, alt = e.altKey;
  let s = null;
  if (k === "Enter") s = "\r";
  else if (k === "Backspace") s = "\x7f";
  else if (k === "Tab") s = "\t";
  else if (k === "Escape") s = "\x1b";
  else if (k === "ArrowUp") s = "\x1b[A";
  else if (k === "ArrowDown") s = "\x1b[B";
  else if (k === "ArrowRight") s = "\x1b[C";
  else if (k === "ArrowLeft") s = "\x1b[D";
  else if (k === "Home") s = "\x1b[H";
  else if (k === "End") s = "\x1b[F";
  else if (k === "PageUp") s = "\x1b[5~";
  else if (k === "PageDown") s = "\x1b[6~";
  else if (k === "Insert") s = "\x1b[2~";
  else if (k === "Delete") s = "\x1b[3~";
  else if (k.startsWith("F") && /^F\d+$/.test(k)) {
    const n = parseInt(k.slice(1), 10);
    s = ["\x1bOP", "\x1bOQ", "\x1bOR", "\x1bOS", "\x1b[15~", "\x1b[17~", "\x1b[18~", "\x1b[19~", "\x1b[20~", "\x1b[21~", "\x1b[23~", "\x1b[24~"][n - 1] || null;
  } else if (ctrl && k.length === 1) {
    s = String.fromCharCode(k.toLowerCase().charCodeAt(0) - 96);
  } else if (alt && k.length === 1) {
    s = "\x1b" + k;
  } else if (k.length === 1) {
    s = k;
  }
  if (s === null || s === undefined) return;
  termSend(new TextEncoder().encode(s));
}

function termSearchOpen() {
  if (!TERM.holder) return;
  const old = TERM.holder.querySelector(".term-search");
  if (old) { old.querySelector("input").focus(); return; }
  const wrap = document.createElement("div");
  wrap.className = "term-search";
  const input = document.createElement("input");
  input.className = "kinput";
  input.placeholder = "Find in terminal";
  input.value = TERM.query;
  const close = document.createElement("button");
  close.className = "kicon";
  close.innerHTML = icon("x");
  close.title = "Close terminal search";
  close.onclick = () => { wrap.remove(); TERM.query = ""; termDraw(); };
  input.oninput = () => { TERM.query = input.value; termDraw(); };
  input.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Escape") { close.onclick(); }
    if (e.key === "Enter") {
      const s = termActive();
      if (s && s.grid) termDraw();
    }
  };
  wrap.appendChild(input);
  wrap.appendChild(close);
  TERM.holder.appendChild(wrap);
  input.focus();
}
function termClear() { termSend(new TextEncoder().encode("\x0c")); }
function termReconnect() {
  const s = termActive();
  if (!s) return;
  const index = TERM.sessions.indexOf(s);
  try { if (s.socket) s.socket.close(); } catch (e) {}
  if (s.canvas && s.canvas.parentNode) s.canvas.parentNode.removeChild(s.canvas);
  if (index >= 0) TERM.sessions.splice(index, 1);
  if (TERM.active >= TERM.sessions.length) TERM.active = TERM.sessions.length - 1;
  connectTerminal();
}
async function termSetCwd() {
  const value = await askInput({ title: "Terminal working directory", placeholder: "workspace-relative path", value: S.settings.terminalCwd || "" });
  if (value === null) return;
  S.settings.terminalCwd = value.trim();
  saveSettings();
  termReconnect();
}
function showTerminal() {
  const body = document.getElementById("bbody");
  body.innerHTML = "";
  const strip = document.createElement("div");
  strip.id = "termstrip";
  strip.style.cssText = "display:flex;gap:4px;align-items:center;padding:2px 4px;flex:none;overflow-x:auto;";
  body.appendChild(strip);
  const tools = document.createElement("div");
  tools.className = "term-tools";
  const tool = (name, label, action) => {
    const b = document.createElement("button");
    b.className = "kicon";
    b.innerHTML = icon(name);
    b.title = label;
    b.setAttribute("data-tip", label);
    b.setAttribute("aria-label", label);
    b.onclick = action;
    tools.appendChild(b);
    return b;
  };
  tool("search", "Find in terminal · Ctrl+Shift+F", termSearchOpen);
  tool("refresh", "Reconnect terminal", termReconnect);
  tool("activity", "Set working directory", termSetCwd);
  tool("trash", "Clear terminal", () => termSend(new TextEncoder().encode("\x0c")));
  const cwd = document.createElement("span");
  cwd.className = "term-cwd";
  cwd.textContent = S.settings.terminalCwd || "workspace";
  tools.appendChild(cwd);
  body.appendChild(tools);
  const holder = document.createElement("div");
  holder.id = "termholder";
  holder.style.cssText = "flex:1;min-height:0;overflow:auto;position:relative;padding:12px;";
  body.appendChild(holder);
  TERM.strip = strip;
  TERM.toolbar = tools;
  TERM.holder = holder;
  if (window.matchMedia("(pointer:coarse)").matches && !document.getElementById("termkeys")) {
    const kb = document.createElement("div");
    kb.id = "termkeys";
    const keys = [["Esc", "\x1b"], ["Tab", "\t"], ["|", "|"], ["~", "~"], ["/", "/"], ["-", "-"], ["←", "\x1b[D"], ["→", "\x1b[C"], ["↑", "\x1b[A"], ["↓", "\x1b[B"], ["^C", "\x03"], ["^D", "\x04"]];
    keys.forEach(([label, seq]) => {
      const b = document.createElement("button");
      b.className = "kbtn";
      b.textContent = label;
      b.onclick = () => termSend(new TextEncoder().encode(seq));
      kb.appendChild(b);
    });
    body.insertBefore(kb, holder);
  }
  termMeasure();
  for (const s of TERM.sessions) {
    s.canvas.style.display = "none";
    holder.appendChild(s.canvas);
  }
  renderTermTabs();
  if (TERM.active < 0 || !TERM.sessions[TERM.active]) {
    if (TERM.sessions.length) activateTerm(0);
    else newTerm();
  } else {
    activateTerm(TERM.active);
  }
}

function renderTermTabs() {
  const strip = TERM.strip;
  if (!strip) return;
  strip.innerHTML = "";
  TERM.sessions.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "tab" + (i === TERM.active ? " sel" : "");
    const nm = document.createElement("span");
    nm.textContent = s.name + (s.ready ? "" : " (dead)");
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "×";
    x.onclick = ev => { ev.stopPropagation(); closeTerm(i); };
    d.appendChild(nm);
    d.appendChild(x);
    d.onclick = () => activateTerm(i);
    strip.appendChild(d);
  });
  const add = document.createElement("button");
  add.className = "kicon ghostadd";
  add.innerHTML = icon("plus");
  add.title = "new terminal (independent shell)";
  add.setAttribute("aria-label", "New terminal");
  add.onclick = () => newTerm();
  strip.appendChild(add);
  const cp = document.createElement("button");
  cp.className = "kicon";
  cp.innerHTML = icon("copy");
  cp.title = "copy selection";
  cp.setAttribute("aria-label", "Copy terminal selection");
  cp.onclick = () => termCopySel();
  strip.appendChild(cp);
}

function activateTerm(i) {
  if (i < 0 || i >= TERM.sessions.length) return;
  TERM.active = i;
  for (let k = 0; k < TERM.sessions.length; k++) {
    TERM.sessions[k].canvas.style.display = k === i ? "" : "none";
  }
  renderTermTabs();
  if (TERM.sessions[i].grid) termDraw();
  fitTerminal();
  TERM.sessions[i].canvas.focus();
}

function closeTerm(i) {
  const s = TERM.sessions[i];
  if (!s) return;
  try { if (s.socket) s.socket.close(); } catch (e) {}
  if (s.canvas && s.canvas.parentNode) s.canvas.parentNode.removeChild(s.canvas);
  TERM.sessions.splice(i, 1);
  if (TERM.active >= TERM.sessions.length) TERM.active = TERM.sessions.length - 1;
  if (!TERM.sessions.length) { TERM.active = -1; newTerm(); return; }
  activateTerm(Math.max(0, TERM.active));
}

function newTerm() {
  connectTerminal();
}

function fitTerminal() {
  const s = termActive();
  if (!s || !s.canvas || !s.socket || s.socket.readyState !== 1) return;
  const d = termDims();
  s.socket.send("resize:" + d.cols + "x" + d.rows);
}

function connectTerminal() {
  const d = termDims();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  let wsUrl = proto + "//" + location.host + "/terms/ws?cols=" + d.cols + "&rows=" + d.rows;
  if (S.settings.terminalCwd) wsUrl += "&cwd=" + encodeURIComponent(S.settings.terminalCwd);
  if (token) wsUrl += "&token=" + encodeURIComponent(token);
  TERM.n += 1;
  const cv = document.createElement("canvas");
  cv.tabIndex = 0;
  cv.onkeydown = termKey;
  cv.onpaste = e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text");
    if (t) termSend(new TextEncoder().encode(t));
  };
  cv.oncontextmenu = e => {
    e.preventDefault();
    showMenu(e.clientX, e.clientY, [
      { label: "Copy selection", icon: "copy", shortcut: "Ctrl+Shift+C", run: termCopySel },
      { label: "Paste", icon: "copy", shortcut: "Ctrl+Shift+V", run: async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (text) termSend(new TextEncoder().encode(text));
        } catch (err) { msg("clipboard permission denied", true); }
      }},
      { sep: true },
      { label: "Find in terminal", icon: "search", shortcut: "Ctrl+Shift+F", run: termSearchOpen },
      { label: "Reconnect shell", icon: "refresh", run: termReconnect },
      { label: "Clear screen", icon: "trash", run: termClear },
      { sep: true },
      { label: "Close terminal", icon: "x", danger: true, run: () => closeTerm(TERM.active) },
    ]);
  };
  cv.onwheel = e => {
    e.preventDefault();
    const max = Math.max(0, (s.history || []).length - 1);
    s.scrollOffset = Math.max(0, Math.min(max, s.scrollOffset - Math.sign(e.deltaY)));
    if (TERM.sessions[TERM.active] === s) termDraw();
  };
  cv.onmousedown = e => {
    cv.focus();
    const r = cv.getBoundingClientRect();
    const c0 = Math.floor((e.clientX - r.left) / TERM.cellW);
    const l0 = Math.floor((e.clientY - r.top) / TERM.cellH);
    s.sel = { active: false, ax: c0, ay: l0, fx: c0, fy: l0, moved: false };
    const move = ev => {
      const c = Math.max(0, Math.floor((ev.clientX - r.left) / TERM.cellW));
      const l = Math.max(0, Math.floor((ev.clientY - r.top) / TERM.cellH));
      if (c !== s.sel.fx || l !== s.sel.fy) {
        s.sel.fx = c;
        s.sel.fy = l;
        s.sel.moved = true;
        s.sel.active = true;
        if (TERM.sessions[TERM.active] === s) termDraw();
      }
    };
    const up = () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      if (!s.sel.moved) s.sel = null;
      else if (TERM.sessions[TERM.active] === s) termDraw();
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  };
  const s = {
    id: "t" + Date.now() + "_" + TERM.n,
    name: "term " + TERM.n,
    socket: null, grid: null, history: [], scrollOffset: 0, canvas: cv, ctx: cv.getContext("2d"), ready: false
  };
  TERM.sessions.push(s);
  if (TERM.holder) { cv.style.display = "none"; TERM.holder.appendChild(cv); }
  let sock;
  try {
    sock = new WebSocket(wsUrl);
  } catch (e) {
    renderTermTabs();
    msg("terminal: cannot open socket", true);
    return;
  }
  sock.binaryType = "arraybuffer";
  s.socket = sock;
  TERM.active = TERM.sessions.length - 1;
  renderTermTabs();
  activateTerm(TERM.active);
  sock.onopen = () => { s.ready = true; renderTermTabs(); cv.focus(); };
  sock.onmessage = ev => {
    try {
       const frame = JSON.parse(ev.data);
       s.grid = frame;
       s.history = Array.isArray(frame.history) ? frame.history : [];
       if (TERM.sessions[TERM.active] === s) termDraw();
    } catch (e) {}
  };
  const dead = () => {
    s.ready = false;
    renderTermTabs();
    if (TERM.sessions[TERM.active] === s) {
      log("console", s.name + " disconnected — open a new one with +");
      msg("terminal disconnected", true);
    }
  };
  sock.onclose = dead;
  sock.onerror = dead;
  window.onresize = () => { if (S.bottomTab === "terminal") fitTerminal(); };
}

function toggleDock(which, force) {

function cycleDetent() {
  const b = document.getElementById("bottom");
  const order = ["peek", "half", "full"];
  const cur = order.indexOf(b.dataset.detent || "half");
  snapDetent(order[(cur + 1) % order.length]);
}
function wireGrab() {
  const grab = document.getElementById("bgrab");
  if (!grab || grab.dataset.wired) return;
  grab.dataset.wired = "1";
  grab.addEventListener("pointerdown", e => {
    const b = document.getElementById("bottom");
    const startY = e.clientY;
    const base = b.getBoundingClientRect().height;
    const samples = [{ t: performance.now(), h: base }];
    grab.setPointerCapture(e.pointerId);
    const move = ev => {
      const h = Math.max(60, Math.min(window.innerHeight - 48, base - (ev.clientY - startY)));
      b.style.height = h + "px";
      const now = performance.now();
      samples.push({ t: now, h });
      while (samples.length > 2 && now - samples[0].t > 90) samples.shift();
    };
    const up = () => {
      grab.removeEventListener("pointermove", move);
      grab.removeEventListener("pointerup", up);
      grab.removeEventListener("pointercancel", up);
      const last = samples[samples.length - 1];
      const first = samples[0];
      const dt = Math.max(1, last.t - first.t) / 1000;
      const v = (last.h - first.h) / dt;
      const projected = last.h + v * 0.18;
      const cands = ["peek", "half", "full"].map(n => ({ n, d: Math.abs(detentPx(n) - projected) }));
      cands.sort((x, y) => x.d - y.d);
      S.layout.bottom = Math.round(last.h);
      snapDetent(cands[0].n, Math.max(-2500, Math.min(2500, v)));
    };
    grab.addEventListener("pointermove", move);
    grab.addEventListener("pointerup", up);
    grab.addEventListener("pointercancel", up);
  });
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));

function fallbackCopy(t) {

  ta.remove();
}

/* ============ fs ops from the tree ============ */
function trackTabForFs(oldAbs, makeNew) {
  // returns {closed: [...]} — caller refreshes tree first
  for (const g of S.groups) {
    for (let i = g.tabs.length - 1; i >= 0; i--) {
      const t = g.tabs[i];
      if (t.path !== oldAbs && !t.path.startsWith(oldAbs + "/")) continue;
      if (makeNew === null) {
        g.tabs.splice(i, 1);
        if (g.active >= g.tabs.length) g.active = g.tabs.length - 1;
      } else {
        t.path = makeNew(t.path);
        t.label = null;
      }
    }
  }
  const g = G();
  if (g.tabs.length === 0) {
    g.active = -1;
    if (ED) ED.setDoc("");
    renderTabs();
  } else {
    if (g.active < 0) g.active = 0;
    activateTab(g.active);
  }
}
async function fsOp(op, body, after) {
  try {
    const j = await post(op, body);
    if (!j.ok) throw new Error(j.error || "failed");
    if (after) await after(j);
    await loadFiles();
    refreshGitCounts();
  } catch (e) { msg(String(e), true); }
}
function fileMenu(x, y, absPath, isDir) {
  const r = rel(absPath);
  const isRoot = !r;
  const items = [];
  const dir = isDir ? r : parentDir(absPath);
  items.push({ label: "New File", run: async () => {
    const name = await askInput({ title: "New file" + (dir ? " in " + dir : ""), placeholder: "name.ext" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: false });
  }});
  items.push({ label: "New Folder", run: async () => {
    const name = await askInput({ title: "New folder" + (dir ? " in " + dir : ""), placeholder: "name" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: true });
  }});
  if (isRoot) {
    items.push({ sep: true });
    items.push({ label: "Refresh", run: () => loadFiles() });
    items.push({ label: "Copy Root Path", run: () => copyText(absPath) });
    showMenu(x, y, items);
    return;
  }
  items.push({ sep: true });
  if (!isDir) {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop();
      const name = await askInput({ title: "Rename", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = dir ? dir + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
    items.push({ label: "Duplicate", run: () => fsOp("/fs/duplicate", { path: r }) });
  } else {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop() || r;
      const name = await askInput({ title: "Rename folder", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = parentDir(absPath) ? parentDir(absPath) + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
  }
  items.push({ label: "Delete", danger: true, run: async () => {
    const ok = await askConfirm({ title: "Delete " + (isDir ? "folder" : "file") + "?", body: r + (isDir ? " and everything inside it" : "") });
    if (ok) {
      await fsOp("/fs/delete", { path: r });
      trackTabForFs(absPath, null);
    }
  }});
  items.push({ sep: true });
  if (!isDir) {
    items.push({ label: "Open to the Side", icon: "panel", run: async () => {
      await openFile(absPath, 0, false);
      if (A()) await openToSide(A());
    }});
    if (S.paneReady) items.push({ label: "Open in New Layout Pane", icon: "plus", run: async () => {
      await paneSplitActive("vertical");
      await openFile(absPath, 0, false);
    }});
  }
  items.push({ label: "Copy Path", run: () => copyText(absPath) });
  items.push({ label: "Copy Relative Path", run: () => copyText(r) });
  if (!isDir) {
    items.push({ label: "Reveal in Tree", run: () => revealInTree(absPath) });
  } else {
    items.push({ label: "Refresh", run: () => loadFiles() });
  }
  showMenu(x, y, items);
}
async function renameTabs(oldAbs, newRel) {
  // server paths are absolute; rebuild tab path from the new relative path
  const ws = wsRoot ? wsRoot + "/" : "";
  for (const g of S.groups) {
    for (const t of g.tabs) {
      if (t.path === oldAbs || t.path.startsWith(oldAbs + "/")) {
        const suffix = t.path.slice(oldAbs.length);
        t.path = ws + newRel + suffix;
      }
    }
  }
  const g = G();
  if (g.active >= 0) activateTab(g.active);
  else renderTabs();
}
let REVEAL = null;

}

/* ============ source control (vscode-style) ============ */
async function refreshGitCounts() {
  try {
    const list = await get("/git/status");
    const entries = list.entries || [];
    let staged = 0, unstaged = 0;
    S.gitStatus = {};
    entries.forEach(e => {
      if (e.staged && e.staged !== " " && e.staged !== "?") staged++;
      if (e.unstaged && e.unstaged !== " ") unstaged++;
      S.gitStatus[e.path] = (e.staged || " ") + (e.unstaged || " ");
    });
    document.getElementById("sgit").textContent =
      entries.length ? ("git +" + staged + " ~" + unstaged) : "git clean";
    if (S.leftTab === "project" && S.docks.left && S.files.length) {
      const box = document.getElementById("leftbody");
      if (box) {
        box.innerHTML = "";
        renderTree(box, buildTree(S.files), 0, "");
      }
    }
  } catch (e) {
    document.getElementById("sgit").textContent = "";
  }
}

async function loadScm() {
  const body = document.getElementById("leftbody");
  body.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.id = "scm";
  const msg2 = document.createElement("textarea");
  msg2.className = "kinput";
  msg2.placeholder = "Message (Ctrl+Enter to commit)";
  msg2.rows = 2;
  msg2.setAttribute("aria-label", "Commit message");
  const msgRow = document.createElement("div");
  msgRow.className = "msgrow";
  const counter = document.createElement("span");
  counter.className = "count";
  counter.textContent = "0/50";
  msgRow.appendChild(counter);
  const commitBtn = document.createElement("button");
  commitBtn.className = "kbtn kbtn-acc";
  commitBtn.textContent = "Commit";
  commitBtn.disabled = true;
  let stagedCount = 0;
  const paintCommit = () => {
    const first = msg2.value.split("\n")[0];
    counter.textContent = first.length + "/50";
    counter.classList.toggle("over", first.length > 50);
    const ok = msg2.value.trim() && stagedCount > 0;
    commitBtn.disabled = !ok;
    commitBtn.classList.toggle("kbtn-acc", !!ok);
  };
  const autogrow = () => {
    msg2.style.height = "auto";
    msg2.style.height = Math.min(140, msg2.scrollHeight) + "px";
  };
  msg2.addEventListener("input", () => { autogrow(); paintCommit(); });
  msg2.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !commitBtn.disabled) {
      e.preventDefault();
      doCommit();
    }
  });
  async function doCommit() {
    const m = msg2.value.trim();
    if (!m || stagedCount <= 0) return;
    try {
      const j = await post("/git/commit", { message: m });
      if (!j.ok) throw new Error(j.error || "commit failed");
      msg2.value = "";
      autogrow();
      log("console", "committed: " + m.split("\n")[0]);
      toast("Committed", "ok");
      await reloadScm();
    } catch (e) {
      msg(String(e), true);
      toast(String(e), "err");
    }
  }
  commitBtn.onclick = doCommit;
  wrap.appendChild(msg2);
  wrap.appendChild(msgRow);
  wrap.appendChild(commitBtn);
  const pushRow = document.createElement("div");
  pushRow.className = "pushrow";
  const pushBtn = document.createElement("button");
  pushBtn.className = "kbtn kbtn-acc";
  pushBtn.innerHTML = icon("push") + "<span>Push</span>";
  const pushChev = document.createElement("button");
  pushChev.className = "kbtn kbtn-acc";
  pushChev.innerHTML = icon("chev-d");
  pushChev.title = "Push options";
  pushChev.setAttribute("aria-label", "Push options");
  let pushing = false;
  let retryArmed = false;
  async function doPush(setUpstream) {
    if (pushing) return;
    pushing = true;
    retryArmed = false;
    pushBtn.disabled = true;
    pushChev.disabled = true;
    pushBtn.innerHTML = '<span class="spin"></span><span>Pushing…</span>';
    try {
      const j = await post("/git/push", setUpstream ? { set_upstream: true } : {});
      if (!j.ok) throw new Error(j.error || "push failed");
      log("console", "pushed" + (j.output ? ": " + String(j.output).trim().split("\n").pop() : ""));
      toast("Pushed", "ok");
      pushBtn.innerHTML = icon("check") + "<span>Pushed</span>";
      setTimeout(() => paintPush(S.pushInfo), 1600);
      await reloadScm();
    } catch (e) {
      msg(String(e), true);
      toast("Push failed — " + String(e.message || e), "err");
      retryArmed = true;
      pushBtn.innerHTML = icon("refresh") + "<span>Retry</span>";
    }
    pushing = false;
    pushBtn.disabled = false;
    pushChev.disabled = false;
  }
  function paintPush(info) {
    if (pushing) return;
    if (retryArmed) return;
    const a = (info && info.ahead) || 0, b = (info && info.behind) || 0;
    if (a > 0 || b > 0) pushBtn.innerHTML = icon("push") + "<span>Push ↑" + a + " ↓" + b + "</span>";
    else pushBtn.innerHTML = icon("push") + "<span>Push</span>";
  }
  pushBtn.onclick = () => doPush(false);
  pushChev.onclick = e => {
    const r = pushChev.getBoundingClientRect();
    showMenu(r.left, r.bottom + 4, [
      { label: "Push", icon: "push", run: () => doPush(false) },
      { label: "Push with upstream", icon: "push", run: () => doPush(true) },
    ]);
  };
  pushRow.appendChild(pushBtn);
  pushRow.appendChild(pushChev);
  wrap.appendChild(pushRow);
  const branchRow = document.createElement("div");
  branchRow.className = "branchrow";
  const branchBtn = document.createElement("button");
  branchBtn.className = "kbtn";
  branchBtn.innerHTML = icon("branch") + "<span>…</span>";
  branchBtn.onclick = e => branchPicker(e);
  const moreBtn = document.createElement("button");
  moreBtn.className = "kicon";
  moreBtn.innerHTML = icon("dots");
  moreBtn.title = "Stash options";
  moreBtn.setAttribute("aria-label", "Stash options");
  moreBtn.onclick = e => {
    const r = moreBtn.getBoundingClientRect();
    showMenu(r.left, r.bottom + 4, [
      { label: "Stash changes…", icon: "plus", run: async () => {
        const m = await askInput({ title: "Stash message (optional)", placeholder: "wip", okLabel: "Stash" });
        if (m === null) return;
        try {
          const j = await post("/git/stash", { message: m || "" });
          if (!j.ok) throw new Error(j.error || "failed");
          toast("Stashed", "ok");
          await reloadScm();
        } catch (err) { msg(String(err), true); }
      }},
      { label: "Pop stash", icon: "check", run: async () => {
        try {
          const j = await post("/git/stash", { pop: true });
          if (!j.ok) throw new Error(j.error || "failed");
          toast("Stash popped", "ok");
          await reloadScm();
        } catch (err) { msg(String(err), true); }
      }},
    ]);
  };
  branchRow.appendChild(branchBtn);
  branchRow.appendChild(moreBtn);
  wrap.appendChild(branchRow);
  body.appendChild(wrap);
  async function reloadScm() {
    try {
      const [st, br, ah] = await Promise.all([
        get("/git/status"),
        get("/git/branches"),
        get("/git/ahead").catch(() => null),
      ]);
      const entries = st.entries || [];
      const branches = br.entries || [];
      const cur = branches.find(b => b.current);
      branchBtn.innerHTML = icon("branch") + "<span></span>";
      branchBtn.lastChild.textContent = (cur && cur.name) || "branch…";
      S.pushInfo = ah && !ah.error ? { ahead: ah.ahead || 0, behind: ah.behind || 0 } : null;
      paintPush(S.pushInfo);
      wrap.querySelectorAll(".staged-sec,.changes-sec").forEach(el => el.remove());
      const sk = document.createElement("div");
      sk.className = "staged-sec";
      wrap.appendChild(sk);
      skel(sk, 5);
      const staged = entries.filter(e => e.staged && e.staged !== " " && e.staged !== "?");
      const changes = entries.filter(e => e.unstaged && e.unstaged !== " ");
      stagedCount = staged.length;
      paintCommit();
      const mkSec = (title, list, stagedFlag) => {
        const sec = document.createElement("div");
        sec.className = stagedFlag ? "staged-sec" : "changes-sec";
        const h = document.createElement("button");
        h.className = "sechead";
        h.setAttribute("aria-expanded", S.scmOpen && S.scmOpen[title] === false ? "false" : "true");
        const chev = document.createElement("span");
        chev.className = "tri";
        chev.innerHTML = icon("chev-r");
        const span = document.createElement("span");
        span.textContent = title + " ";
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = list.length;
        h.appendChild(chev);
        h.appendChild(span);
        h.appendChild(n);
        sec.appendChild(h);
        const kids = document.createElement("div");
        kids.className = "seckids";
        if (S.scmOpen && S.scmOpen[title] === false) {
          kids.classList.add("closed");
          sec.classList.remove("open");
          h.setAttribute("aria-expanded", "false");
        } else {
          sec.classList.add("open");
        }
        h.onclick = () => {
          const shut = kids.classList.toggle("closed");
          sec.classList.toggle("open", !shut);
          h.setAttribute("aria-expanded", shut ? "false" : "true");
          S.scmOpen = S.scmOpen || {};
          S.scmOpen[title] = !shut;
        };
        if (!list.length) {
          const em = document.createElement("div");
          em.className = "logline";
          em.textContent = stagedFlag ? "(nothing staged)" : "(working tree clean)";
          kids.appendChild(em);
        }
        list.forEach(e => {
          scmFileRow(kids, e, stagedFlag, stagedFlag
            ? [["minus", "unstage", async () => {
                const j = await post("/git/unstage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }]]
            : [["plus", "stage", async () => {
                const j = await post("/git/stage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }], ["x", "discard changes", async () => {
                const ok = await askConfirm({ title: "Discard changes?", body: e.path, okLabel: "Discard" });
                if (!ok) return;
                const j = await post("/git/discard", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
                loadFiles();
              }]]);
        });
        sec.appendChild(kids);
        wrap.appendChild(sec);
      };
      mkSec("staged", staged, true);
      mkSec("changes", changes, false);
      if (sk.parentNode) sk.parentNode.removeChild(sk);
      refreshGitCounts();
      health();
    } catch (e) { msg(String(e), true); }
  }
  paintCommit();
  await reloadScm();
}

function runFind() {
  const t = A();
  if (!t || !ED) return;
  const needle = document.getElementById("findneedle").value;
  const text = ED.getDoc();
  FIND.matches = [];
  FIND.cur = -1;
  if (needle) {
    const hay = FIND.matchCase ? text : text.toLowerCase();
    const nd = FIND.matchCase ? needle : needle.toLowerCase();
    let i = 0;
    while (FIND.matches.length < 2000) {
      i = hay.indexOf(nd, i);
      if (i < 0) break;
      FIND.matches.push({ from: i, to: i + nd.length, cur: false });

  FIND.matches.forEach((m, i) => { m.cur = i === FIND.cur; });
  const t = A();
  if (t && ED) {
    if (!S.marks || S.marks.path !== t.path) {
      S.marks = { path: t.path, spans: [], hunks: [], untracked: false, diags: [], find: [] };
    }
    S.marks.find = FIND.matches;
    for (const ed of ED_ALL) {
      if (ed && ed.remark) { try { ed.remark(); } catch (e) {} }
    }
    if (FIND.cur >= 0 && ED.sel) {

    }

}
function findStep(d) {

}

/* ============ spring physics (Apple-style interruptible motion) ============
   Critically-damped by default (no bounce, like Apple's own default);
   Snappy adds a whisper of overshoot for gesture-driven releases.
   Retargeting preserves velocity; reduced motion jumps to target. */
const Spring = {
  presets: {
    smooth: { s: 170, d: 27 },
    snappy: { s: 220, d: 20 },
  },
  live: new Map(),
  reduced() {
    return document.body.classList.contains("noanim") ||
      document.body.classList.contains("calm") ||
      (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  },
  to(key, from, to, preset, onUpdate, onDone, v0) {
    const prev = Spring.live.get(key);
    let v = isFinite(v0) ? v0 : (prev && isFinite(prev.v) ? prev.v : 0);
    if (prev && prev.raf) cancelAnimationFrame(prev.raf);
    if (Spring.reduced()) {
      Spring.live.delete(key);
      onUpdate(to);
      if (onDone) onDone();
      return () => {};
    }
    const p = Spring.presets[preset] || Spring.presets.smooth;
    const st = { x: from, v, raf: 0, last: 0 };
    Spring.live.set(key, st);
    const step = now => {
      if (Spring.live.get(key) !== st) return;
      const dt = Math.min(0.032, st.last ? (now - st.last) / 1000 : 0.016);
      st.last = now;
      const F = -p.s * (st.x - to) - p.d * st.v;
      st.v += F * dt;
      st.x += st.v * dt;
      if (Math.abs(st.x - to) < 0.4 && Math.abs(st.v) < 6) {
        Spring.live.delete(key);
        onUpdate(to);
        if (onDone) onDone();
        return;
      }
      onUpdate(st.x);
      st.raf = requestAnimationFrame(step);
    };
    st.raf = requestAnimationFrame(step);
    return () => {
      if (Spring.live.get(key) === st) {
        Spring.live.delete(key);
        cancelAnimationFrame(st.raf);
      }
    };
  },
};
function detentPx(name) {
  if (name === "peek") return 76;
  if (name === "half") return Math.round(window.innerHeight * 0.45);
  return Math.max(200, window.innerHeight - 64);
}
function snapDetent(name, v0) {
  const b = document.getElementById("bottom");
  b.dataset.detent = name;
  const from = b.getBoundingClientRect().height;
  const target = detentPx(name);
  b.style.height = from + "px";
  Spring.to("detent", from, target, "snappy",
    v => { b.style.height = v + "px"; },
    () => {
      b.style.height = target + "px";
      S.layout.bottom = Math.round(target);
      saveLayout();
    }, v0);
}
function resetLayout() {
  const L = { left: 264, right: 232, bottom: 192 };
  const le = document.getElementById("left");
  const re = document.getElementById("right");
  const be = document.getElementById("bottom");
  if (le && S.docks.left) {
    const from = le.getBoundingClientRect().width;
    Spring.to("dockL", from, L.left, "smooth", v => { le.style.width = v + "px"; });
  }
  if (re && S.docks.right) {
    const from = re.getBoundingClientRect().width;
    Spring.to("dockR", from, L.right, "smooth", v => { re.style.width = v + "px"; });
  }
  if (be && S.docks.bottom) {
    const from = be.getBoundingClientRect().height;
    Spring.to("dockB", from, L.bottom, "smooth", v => { be.style.height = v + "px"; });
  }
  S.layout = Object.assign({}, L);
  saveLayout();
}

/* Design-system toast: floating, auto-dismissing. kind: "" | "ok" | "err". */
function toast(text, kind) {
  let box = document.getElementById("ktoasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "ktoasts";
    document.body.appendChild(box);
  }
  const d = document.createElement("div");
  d.className = "ktoast" + (kind ? " " + kind : "");
  const ic = document.createElement("span");
  ic.innerHTML = icon(kind === "err" ? "xcirc" : kind === "ok" ? "check" : "info");
  if (kind === "err") ic.style.color = "var(--error)";
  else if (kind === "ok") ic.style.color = "var(--ok)";
  else ic.style.color = "var(--text2)";
  d.appendChild(ic);
  const t = document.createElement("span");
  t.textContent = text;
  d.appendChild(t);
  const kill = () => {
    d.classList.add("out");
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 180);
  };
  d.onclick = kill;
  box.appendChild(d);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(kill, 3600);
}
