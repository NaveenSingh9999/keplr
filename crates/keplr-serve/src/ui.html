<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keplr</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect x='16' y='16' width='480' height='480' rx='110' fill='%230e1116'/><ellipse cx='256' cy='256' rx='150' ry='96' fill='none' stroke='%2358a6ff' stroke-width='30' transform='rotate(-18 256 256)'/><circle cx='256' cy='256' r='22' fill='%23e6edf3'/><circle cx='336' cy='158' r='34' fill='%2358a6ff'/></svg>">
<style>
  :root {
    --bg: #0e1116;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #2a3340;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --error: #f85149;
    --warn: #d29922;
    --ok: #3fb950;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  * {
    scrollbar-width: thin;
    scrollbar-color: #2a3340 transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: #2a3340;
    border-radius: 8px;
    border: 2px solid #0e1116;
    min-height: 30px;
  }
  *::-webkit-scrollbar-thumb:hover { background: #58a6ff; border-color: transparent; }
  *::-webkit-scrollbar-corner { background: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* ---- titlebar ---- */
  #titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  #titlebar .logo { color: var(--accent); font-weight: bold; }
  #titlebar #root { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  #finder {
    flex: 1;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font: inherit;
    text-align: center;
  }
  #finder::placeholder { color: var(--dim); }
  #titlebar .spacer { flex: 1; }
  #titlebar input#token {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; font: inherit; width: 170px;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.ok { background: var(--ok); }
  #dot.bad { background: var(--error); }
  .iconbtn {
    background: none; border: none; color: var(--dim);
    font: inherit; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .iconbtn:hover, .iconbtn.on { color: var(--text); background: var(--border); }
  /* ---- workbench ---- */
  #workbench { display: flex; flex: 1; min-height: 0; }
  .dock { background: var(--surface); display: flex; flex-direction: column; min-height: 0; flex: none; }
  .dock.hidden { display: none; }
  #left { width: 270px; border-right: 1px solid var(--border); resize: horizontal; overflow: auto; min-width: 170px; max-width: 480px; }
  #right { width: 230px; border-left: 1px solid var(--border); resize: horizontal; overflow: auto; min-width: 150px; max-width: 420px; direction: rtl; }
  #right > * { direction: ltr; }
  .docktabs { display: flex; gap: 2px; padding: 6px 8px 0; flex: none; }
  .docktabs button {
    background: none; border: none; color: var(--dim);
    font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .docktabs button.sel { color: var(--text); border-bottom-color: var(--accent); }
  .dockbody { flex: 1; overflow: auto; padding: 4px 4px 10px; min-height: 0; }
  /* file tree */
  .tnode { user-select: none; }
  .trow {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trow:hover { background: var(--border); }
  .trow.sel { background: var(--border); color: var(--accent); }
  .trow svg { flex: none; }
  .tkids { margin-left: 14px; }
  .tkids.closed { display: none; }
  .tri { color: var(--dim); font-size: 10px; width: 12px; flex: none; text-align: center; }
  /* ---- center ---- */
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #tabsbar {
    display: flex; align-items: stretch; gap: 2px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 4px 8px 0; overflow-x: auto; flex: none;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px 5px 12px; cursor: pointer; white-space: nowrap;
    color: var(--dim); border-bottom: 2px solid transparent; font-size: 12px;
  }
  .tab.sel { color: var(--text); border-bottom-color: var(--accent); background: var(--bg); border-radius: 6px 6px 0 0; }
  .tab .dirty { color: var(--warn); }
  .tab .x { color: var(--dim); border-radius: 4px; padding: 0 4px; }
  .tab .x:hover { color: var(--error); background: var(--border); }
  #crumbs { padding: 5px 14px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--border); flex: none; }
  #crumbs b { color: var(--text); font-weight: normal; }
  #editorwrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  #editorwrap .cm-editor { height: 100%; }
  #editorwrap .cm-scroller { overflow: auto; }
  #fallback {
    display: none; width: 100%; height: 100%; background: var(--bg); color: var(--text);
    border: none; outline: none; resize: none; padding: 8px 12px;
    font: inherit; line-height: 1.55; white-space: pre;
  }
  /* ---- bottom dock ---- */
  #bottom { height: 190px; flex: none; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; resize: vertical; overflow: auto; min-height: 90px; max-height: 60vh; }
  #bottom.hidden { display: none; }
  #bbody { flex: 1; overflow: auto; padding: 6px 14px; min-height: 0; }
  #bbody .hit { cursor: pointer; padding: 2px 0; }
  #bbody .hit:hover { color: var(--accent); }
  #bbody .task { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  #bbody .task button {
    background: var(--border); color: var(--text); border: none;
    border-radius: 4px; font: inherit; padding: 2px 10px; cursor: pointer;
  }
  #bbody pre { white-space: pre-wrap; margin: 6px 0 0; color: var(--dim); }
  #bbody .prob { cursor: pointer; padding: 2px 0; }
  #bbody .prob:hover { color: var(--accent); }
  #bbody .logline { padding: 1px 0; color: var(--dim); }
  #termcanvas { display: block; width: 100%; height: 100%; outline: none; cursor: text; }
  /* ---- statusbar ---- */
  #statusbar {
    display: flex; gap: 14px; padding: 4px 12px; flex: none;
    background: var(--surface); border-top: 1px solid var(--border);
    color: var(--dim); font-size: 12px; align-items: center;
  }
  #statusbar .right { margin-left: auto; display: flex; gap: 14px; }
  .err { color: var(--error); }
  /* ---- palette ---- */
  #palwrap {
    display: none; position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(560px, 90vw); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; z-index: 10;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); overflow: hidden;
  }
  #palwrap.open { display: block; }
  #palinput {
    width: 100%; background: transparent; color: var(--text);
    border: none; outline: none; padding: 10px 14px; font: inherit; font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  #palist { max-height: 300px; overflow: auto; padding: 4px; }
  #palist div { padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  #palist div.sel { background: var(--border); color: var(--accent); }
  #palist .cmd { color: var(--dim); font-size: 12px; margin-left: 8px; }
  /* ---- context menu ---- */
  #ctxmenu {
    display: none; position: fixed; z-index: 20; min-width: 220px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  #ctxmenu.open { display: block; }
  #ctxmenu .mi {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
  }
  #ctxmenu .mi:hover { background: var(--border); }
  #ctxmenu .mi.danger { color: var(--error); }
  #ctxmenu .mi.danger:hover { background: #3d1d1d; }
  #ctxmenu .mi .k { margin-left: auto; color: var(--dim); font-size: 11px; }
  #ctxmenu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
  /* ---- modal ---- */
  #modalwrap {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.5);
    align-items: flex-start; justify-content: center; padding-top: 18vh;
  }
  #modalwrap.open { display: flex; }
  #modal {
    width: min(420px, 90vw); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  #modal h3 { margin: 0 0 10px; font-size: 13px; font-weight: normal; }
  #modal input, #modal textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; outline: none;
  }
  #modal input:focus, #modal textarea:focus { border-color: var(--accent); }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #modal button {
    background: var(--border); color: var(--text); border: none;
    border-radius: 6px; font: inherit; padding: 5px 14px; cursor: pointer;
  }
  #modal button.primary { background: var(--accent); color: #04101f; font-weight: bold; }
  #modal button.danger { background: var(--error); color: #fff; font-weight: bold; }
  /* ---- source control ---- */
  #scm { display: flex; flex-direction: column; height: 100%; gap: 8px; }
  #scm textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; outline: none; resize: vertical; min-height: 56px;
  }
  #scm textarea:focus { border-color: var(--accent); }
  #scm .commitbtn {
    background: var(--accent); color: #04101f; border: none; font-weight: bold;
    border-radius: 6px; font: inherit; padding: 6px; cursor: pointer;
  }
  #scm .commitbtn:disabled { opacity: .45; cursor: default; }
  #scm h4 { margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: normal; display: flex; align-items: center; gap: 6px; }
  #scm h4 .n { background: var(--border); border-radius: 8px; padding: 0 7px; font-size: 11px; }
  #scm h4 button { margin-left: auto; }
  #scm .mini {
    background: none; border: none; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 1px 6px; border-radius: 4px;
  }
  #scm .mini:hover { color: var(--text); background: var(--border); }
  #scm .filerow {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  #scm .filerow:hover { background: var(--border); }
  #scm .filerow .badge {
    font-size: 11px; width: 14px; flex: none; text-align: center; font-weight: bold;
  }
  #scm .filerow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #scm .filerow .act { display: none; gap: 2px; }
  #scm .filerow:hover .act { display: flex; }
  #scm .filerow .act button {
    background: none; border: none; color: var(--dim);
    font: inherit; cursor: pointer; padding: 0 5px; border-radius: 4px; font-size: 13px;
  }
  #scm .filerow .act button:hover { color: var(--text); background: var(--surface2); }
  #scm select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; font: inherit; max-width: 100%;
  }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button { transition: background-color .12s, color .12s; }
  .trow, .tab, #files div { transition: background-color .12s; }
</style>

<body>

  <span class="logo">keplr</span>

  <input id="finder" placeholder="find files…  (ctrl+p)" autocomplete="off" spellcheck="false">
  <span class="spacer"></span>
  <button class="iconbtn" id="t-left" title="project panel">◧</button>

  <div class="dock" id="left">
    <div class="docktabs">
      <button data-ltab="project" class="sel">project</button>
      <button data-ltab="search">search</button>
      <button data-ltab="source">source</button>

    <div class="dockbody" id="leftbody"></div>

  </div>
  <div style="padding:0 12px;"><input id="needle" placeholder="search content…" autocomplete="off" spellcheck="false" style="width:100%;margin:6px 0;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font:inherit;"></div>

</div>

  <span id="sbranch">branch: …</span><span id="sgit"></span><span id="serrors">errors: 0</span>

<script type="module">
import { EditorView, basicSetup } from "codemirror";
import { EditorState, Compartment } from "@codemirror/state";
import { oneDark } from "@codemirror/theme-one-dark";
import { keymap } from "@codemirror/view";

/* ============ transport ============ */
let token = "";
let wsRoot = "";
function url(path) {
  const q = token ? ((path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token)) : "";
  return path + q;
}
async function get(path) {
  const r = await fetch(url(path));
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(url(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function rel(p) {
  if (wsRoot && (p === wsRoot || p.startsWith(wsRoot + "/"))) {
    return p.slice(wsRoot.length + 1) || p;
  }
  return p;
}

/* ============ icons (inline SVG, no assets) ============ */
const LANG_COLORS = {
  rust: "#dea584", python: "#3572A5", typescript: "#3178c6", tsx: "#3178c6",
  javascript: "#f1e05a", cpp: "#f34b7d", c: "#555555", csharp: "#178600",
  go: "#00ADD8", java: "#b07219", swift: "#F05138", kotlin: "#A97BFF",
  ruby: "#701516", php: "#4F5D95", html: "#e34c26", css: "#563d7c",
  json: "#cbcb41", toml: "#9c4221", yaml: "#cb171e", markdown: "#083fa1",
  shell: "#89e051", sql: "#e38c00", lua: "#000080", laml: "#58a6ff", text: "#8b949e"
};
function fileIcon(lang, name) {
  const c = LANG_COLORS[lang] || LANG_COLORS.text;
  const label = (lang || "txt").slice(0, 3);
  return `<svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.5" fill="none" stroke="${c}" stroke-width="1.4"/><text x="8" y="10.5" font-size="5" text-anchor="middle" fill="${c}" font-family="monospace">${esc(label)}</text></svg>`;
}
const FOLDER_CLOSED = `<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 4.5c0-.8.7-1.5 1.5-1.5h3l1.5 2h6c.8 0 1.5.7 1.5 1.5v5c0 .8-.7 1.5-1.5 1.5h-11c-.8 0-1.5-.7-1.5-1.5z" fill="none" stroke="#8b949e" stroke-width="1.3"/></svg>`;
const FOLDER_OPEN = `<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 3h4l1.5 2h7.5c.8 0 1.5.7 1.5 1.5v1h-13v-3c0-.8.7-1.5 1.5-1.5z" fill="#2a3340" stroke="#8b949e" stroke-width="1.1"/><rect x="1.5" y="7.5" width="13" height="5" rx="1" fill="#2a3340" stroke="#8b949e" stroke-width="1.1"/></svg>`;

/* ============ state ============ */
const S = {
  tabs: [],            // {path, lang, text, saved, sel}
  active: -1,
  files: [],           // rel paths
  leftTab: "project",
  bottomTab: "search",
  problems: [],
  palSel: 0,
  palItems: [],
  log: [],
  docks: { left: true, right: false, bottom: false },
};
function saveLayout() {
  try { localStorage.setItem("keplr-layout", JSON.stringify(S.docks)); } catch (e) {}
}
function loadLayout() {
  try {
    const l = JSON.parse(localStorage.getItem("keplr-layout") || "null");
    if (l) S.docks = Object.assign(S.docks, l);
  } catch (e) {}
}
function langOf(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  const map = {
    ts: "typescript", tsx: "tsx", js: "javascript", jsx: "javascript",
    cpp: "cpp", cc: "cpp", cxx: "cpp", h: "cpp", hpp: "cpp",
    go: "go", rs: "rust", lm: "laml", py: "python", c: "c", cs: "csharp",
    java: "java", swift: "swift", kt: "kotlin", kts: "kotlin", rb: "ruby",
    php: "php", html: "html", htm: "html", css: "css", json: "json",
    toml: "toml", yaml: "yaml", yml: "yaml", md: "markdown", sh: "shell",
    bash: "shell", sql: "sql", lua: "lua"
  };
  return map[ext] || "text";
}

/* ============ editor (CodeMirror, textarea fallback) ============ */
let ED = null; // adapter or null
function langExt(label, mods) {
  switch (label) {
    case "rust": return mods.rust ? mods.rust() : [];
    case "python": return mods.python ? mods.python() : [];
    case "javascript": return mods.javascript ? mods.javascript() : [];
    case "typescript": return mods.javascript ? mods.javascript({ typescript: true }) : [];
    case "tsx": return mods.javascript ? mods.javascript({ typescript: true, jsx: true }) : [];
    case "cpp": case "c": case "csharp": case "java": case "kotlin":
      return mods.cpp ? mods.cpp() : [];
    case "go": return mods.go ? mods.go() : [];
    case "html": case "php": return mods.html ? mods.html() : [];
    case "css": return mods.css ? mods.css() : [];
    case "json": return mods.json ? mods.json() : [];
    case "markdown": return mods.markdown ? mods.markdown() : [];
    case "sql": return mods.sql ? mods.sql() : [];
    default: return [];
  }
}
async function bootEditor() {
  const wrap = document.getElementById("editorwrap");
  try {
    const cm = await import("codemirror");
    const state = await import("@codemirror/state");
    const view = await import("@codemirror/view");
    const theme = await import("@codemirror/theme-one-dark");
    const mods = {};
    const loads = {
      rust: "@codemirror/lang-rust", python: "@codemirror/lang-python",
      javascript: "@codemirror/lang-javascript", cpp: "@codemirror/lang-cpp",
      go: "@codemirror/lang-go", html: "@codemirror/lang-html",
      css: "@codemirror/lang-css", json: "@codemirror/lang-json",
      markdown: "@codemirror/lang-markdown", sql: "@codemirror/lang-sql",
      php: "@codemirror/lang-php", java: "@codemirror/lang-java"
    };
    for (const k of Object.keys(loads)) {
      try { mods[k.replace("javascript", "javascript")] = await import(loads[k]); }
      catch (e) { /* language stays plain on CDN failure */ }
    }
    const langConf = new state.Compartment();
    const onChange = view.EditorView.updateListener.of(v => {
      if (v.docChanged) markDirty(true);
      const s = v.state.selection.main;
      const line = v.state.doc.lineAt(s.head);
      setCursor(line.number, s.head - line.from + 1);
    });
    const saveKey = { key: "Mod-s", preventDefault: true, run: () => { saveActive(); return true; } };
    const ed = new cm.EditorView({
      doc: "",
      extensions: [
        cm.basicSetup, theme.oneDark, view.EditorView.lineWrapping,
        langConf.of([]), view.keymap.of([saveKey]), onChange
      ],
      parent: wrap
    });
    ED = {
      cm: true, view: ed, langConf, mods, state,
      async setLang(label) {
        const ext = langExt(label, mods);
        ed.dispatch({ effects: langConf.reconfigure(ext) });
      },
      setDoc(text) { ed.dispatch({ changes: { from: 0, to: ed.state.doc.length, insert: text } }); },
      getDoc() { return ed.state.doc.toString(); },
      goto(line) {
        try {
          const l = ed.state.doc.line(Math.max(1, Math.min(line, ed.state.doc.lines)));
          ed.dispatch({ selection: { anchor: l.from }, effects: view.EditorView.scrollIntoView(l.from, { y: "center" }) });
          ed.focus();
        } catch (e) {}
      },
      focus() { ed.focus(); }
    };
    log("console", "editor: CodeMirror 6");
  } catch (e) {
    const ta = document.getElementById("fallback");
    ta.style.display = "block";
    ta.addEventListener("input", () => markDirty(true));
    ta.addEventListener("keydown", ev => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") { ev.preventDefault(); saveActive(); }
      else if (ev.key === "Tab") {
        ev.preventDefault();
        const s = ta.selectionStart;
        ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 2;
        markDirty(true);
      }
    });
    ED = {
      cm: false,
      async setLang() {},
      setDoc(t) { ta.value = t; },
      getDoc() { return ta.value; },
      goto(line) {
        const lines = ta.value.split("\n");
        let pos = 0;
        for (let i = 0; i < Math.min(line - 1, lines.length); i++) pos += lines[i].length + 1;
        ta.focus();
        ta.selectionStart = ta.selectionEnd = pos;
        setCursor(line, 1);
      },
      focus() { ta.focus(); }
    };
    log("console", "editor: offline fallback (CDN unreachable)");
  }
}

/* ============ tabs ============ */
function markDirty(d) {
  const t = S.tabs[S.active];
  if (!t) return;
  t.dirty = d;
  renderTabs();
}
function renderTabs() {
  const bar = document.getElementById("tabsbar");
  bar.innerHTML = "";
  S.tabs.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "tab" + (i === S.active ? " sel" : "");
    const nm = document.createElement("span");
    nm.textContent = rel(t.path).split("/").pop() + (t.dirty ? " ●" : "");
    if (t.dirty) nm.classList.add("dirty");
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "×";
    x.onclick = ev => { ev.stopPropagation(); closeTab(i); };
    d.appendChild(nm);
    d.appendChild(x);
    d.onclick = () => activateTab(i);
    d.title = rel(t.path);
    d.oncontextmenu = ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const items = [
        { label: "Close", run: () => closeTab(i) },
        { label: "Close Others", run: () => {
          for (let j = S.tabs.length - 1; j >= 0; j--) {
            if (j !== i) closeTab(j);
          }
        }},
        { label: "Close All", run: () => {
          for (let j = S.tabs.length - 1; j >= 0; j--) closeTab(j);
        }},
        { sep: true },
        { label: "Copy Path", run: () => copyText(t.path) },
        { label: "Copy Relative Path", run: () => copyText(rel(t.path)) },
        { label: "Reveal in Tree", run: () => revealInTree(t.path) },
      ];
      showMenu(ev.clientX, ev.clientY, items);
    };
    bar.appendChild(d);
  });
  const crumbs = document.getElementById("crumbs");
  const t = S.tabs[S.active];
  if (!t) { crumbs.innerHTML = "<b>(no file)</b>"; return; }
  const parts = rel(t.path).split("/");
  crumbs.innerHTML = parts.map((p, i) =>
    i === parts.length - 1 ? "<b>" + esc(p) + "</b>" : esc(p)
  ).join(" <span style='opacity:.5'>›</span> ");
  document.getElementById("slang").textContent = t.lang;
}
function snapshotTab() {
  const t = S.tabs[S.active];
  if (!t || !ED) return;
  t.text = ED.getDoc();
  try {
    if (ED.cm) {
      const s = ED.view.state.selection.main;
      t.sel = s.head;
    }
  } catch (e) {}
}
function activateTab(i) {
  if (i < 0 || i >= S.tabs.length) return;
  snapshotTab();
  S.active = i;
  const t = S.tabs[i];
  if (ED.cm) {
    ED.setDoc(t.text);
    ED.setLang(t.lang);
    try {
      const pos = Math.min(t.sel || 0, ED.view.state.doc.length);
      ED.view.dispatch({ selection: { anchor: pos } });
    } catch (e) {}
  } else {
    ED.setDoc(t.text);
  }
  renderTabs();
  renderProblems();
  loadSymbols(t.path);
  ED.focus();
}
function closeTab(i) {
  const t = S.tabs[i];
  if (t && t.dirty && !confirm("Close without saving " + rel(t.path) + "?")) return;
  S.tabs.splice(i, 1);
  if (S.active >= S.tabs.length) S.active = S.tabs.length - 1;
  if (S.tabs.length === 0) {
    if (ED) ED.setDoc("");
    renderTabs();
    renderProblems();
    document.getElementById("symbols").innerHTML = "";
    return;
  }
  const j = S.active;
  S.active = -1;
  activateTab(Math.min(j, S.tabs.length - 1));
}
async function openFile(path, line) {
  const found = S.tabs.findIndex(t => t.path === path);
  if (found >= 0) {
    activateTab(found);
  } else {
    const j = await get("/open?path=" + encodeURIComponent(path));
    if (j.error) throw new Error(j.error);
    const lang = langOf(path);
    S.tabs.push({ path, lang, text: j.text || "", saved: j.text || "", sel: 0, dirty: false });
    S.active = -1;
    activateTab(S.tabs.length - 1);
  }
  if (line) gotoLine(line);
  document.querySelectorAll("#leftbody .trow").forEach(d => {
    d.classList.toggle("sel", d.dataset.path === path);
  });
  if (langOf(path) === "laml") loadProblems(path);
  else renderProblems();
  loadSymbols(path);
  setDot(true);
  msg("");
}
function gotoLine(line) {
  if (ED) ED.goto(line || 1);
}
async function saveActive() {
  const t = S.tabs[S.active];
  if (!t || !ED) return;
  snapshotTab();
  try {
    const j = await post("/save", { path: t.path, content: t.text });
    if (!j.ok) throw new Error(j.error || "save failed");
    t.saved = t.text;
    t.dirty = false;
    renderTabs();
    const r = j.report || {};
    msg("saved " + (r.bytes || 0) + "b · " + String(r.hash || "").slice(0, 12) + " · git=" + (r.git_committed ? "committed" : "skipped"));
    log("console", "saved " + rel(t.path));
    if (t.lang === "laml") loadProblems(t.path);
    setDot(true);
  } catch (e) { setDot(false); msg(String(e), true); }
}

/* ============ file tree ============ */
function buildTree(paths) {
  const root = {};
  paths.forEach(p => {
    const parts = rel(p).split("/");
    let node = root;
    parts.forEach((part, i) => {
      const last = i === parts.length - 1;
      node[part] = node[part] || { __kids: null, __full: null };
      if (last) node[part].__full = p;
      else {
        node[part].__kids = node[part].__kids || {};
        node = node[part].__kids;
      }
    });
  });
  return root;
}
function renderTree(box, node, depth, base) {
  base = base || "";
  const names = Object.keys(node).sort((a, b) => {
    const da = node[a].__kids ? 0 : 1, db = node[b].__kids ? 0 : 1;
    return da - db || (a < b ? -1 : 1);
  });
  names.forEach(name => {
    const n = node[name];
    const full = base ? base + "/" + name : name;
    const row = document.createElement("div");
    row.className = "trow";
    row.style.paddingLeft = (6 + depth * 14) + "px";
    if (n.__kids) {
      const isAncestor = REVEAL && (REVEAL === full || REVEAL.startsWith(full + "/"));
      row.innerHTML = '<span class="tri">▸</span>' + FOLDER_CLOSED + "<span></span>";
      row.lastChild.textContent = name;
      row.dataset.dir = full;
      const kids = document.createElement("div");
      kids.className = "tkids" + (isAncestor ? "" : " closed");
      let open = !!isAncestor;
      const setTri = () => { row.querySelector(".tri").textContent = open ? "▾" : "▸"; };
      setTri();
      row.onclick = () => {
        open = !open;
        kids.classList.toggle("closed", !open);
        setTri();
      };
      row.oncontextmenu = e => {
        e.preventDefault();
        e.stopPropagation();
        fileMenu(e.clientX, e.clientY, wsRoot ? wsRoot + "/" + full : full, true);
      };
      box.appendChild(row);
      box.appendChild(kids);
      renderTree(kids, n.__kids, depth + 1, full);
    } else {
      const lang = langOf(n.__full || name);
      row.innerHTML = '<span class="tri"></span>' + fileIcon(lang) + "<span></span>";
      row.lastChild.textContent = name;
      row.dataset.path = n.__full;
      if (n.__full === (S.tabs[S.active] || {}).path) row.classList.add("sel");
      row.onclick = () => openFile(n.__full, 0).catch(e => msg(String(e), true));
      row.oncontextmenu = e => {
        e.preventDefault();
        e.stopPropagation();
        fileMenu(e.clientX, e.clientY, n.__full, false);
      };
      box.appendChild(row);
      if (REVEAL && n.__full === REVEAL) {
        row.classList.add("sel");
        row.scrollIntoView({ block: "center" });
      }
    }
  });
}
function loadFiles() {
  const q = "";
  get("/files?query=" + encodeURIComponent(q) + "&limit=5000")
    .then(list => {
      S.files = (list || []).map(f => f.path);
      const box = document.getElementById("leftbody");
      box.innerHTML = "";
      renderTree(box, buildTree(S.files), 0, "");
      REVEAL = null;
      document.getElementById("sfiles").textContent = "files: " + S.files.length;
      setDot(true);
    })
    .catch(e => { setDot(false); msg(String(e), true); });
  const box = document.getElementById("leftbody");
  box.oncontextmenu = e => {
    if (e.target === box) {
      e.preventDefault();
      fileMenu(e.clientX, e.clientY, wsRoot, true);
    }
  };
}

/* ============ terminal (canvas, alacritty_terminal grid) ============ */
const TERM = { canvas: null, ctx: null, socket: null, grid: null, cursor: [0, 0], show: true, ready: false, cellW: 8, cellH: 16, font: "" };

function termFont(px) {
  return px + 'px "SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace';
}

function termMeasure() {
  const c = document.createElement("canvas").getContext("2d");
  c.font = termFont(13);
  TERM.cellW = Math.max(5, Math.ceil(c.measureText("M").width));
  TERM.cellH = Math.ceil(13 * 1.4);
  TERM.font = termFont(13);
}

function termDims() {
  const body = document.getElementById("bbody");
  const w = Math.max(80, body.clientWidth - 28);
  const h = Math.max(60, body.clientHeight - 16);
  return {
    cols: Math.max(20, Math.floor(w / TERM.cellW)),
    rows: Math.max(5, Math.floor(h / TERM.cellH)),
    w: w,
    h: h
  };
}

function termDraw() {
  const g = TERM.grid;
  if (!TERM.ctx || !g) return;
  const ctx = TERM.ctx;
  const dpr = window.devicePixelRatio || 1;
  const W = g.cols * TERM.cellW, H = g.rows * TERM.cellH;
  if (TERM.canvas.width !== Math.round(W * dpr) || TERM.canvas.height !== Math.round(H * dpr)) {
    TERM.canvas.width = Math.round(W * dpr);
    TERM.canvas.height = Math.round(H * dpr);
    TERM.canvas.style.width = W + "px";
    TERM.canvas.style.height = H + "px";
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#161b22";
  ctx.fillRect(0, 0, W, H);
  ctx.font = TERM.font;
  ctx.textBaseline = "top";
  for (let l = 0; l < g.rows; l++) {
    const row = g.cells[l];
    if (!row) continue;
    for (let c = 0; c < g.cols; c++) {
      const cell = row[c];
      if (!cell) continue;
      const x = c * TERM.cellW, y = l * TERM.cellH;
      const ch = cell[0], fg = cell[1], bg = cell[2], fl = cell[3];
      let fgc = fg || "#e6edf3";
      let bgc = bg;
      if (fl & 4) { const t = fgc; fgc = bgc || "#161b22"; bgc = t === "#e6edf3" ? null : t; }
      if (bgc) { ctx.fillStyle = bgc; ctx.fillRect(x, y, TERM.cellW, TERM.cellH); }
      if (ch && ch !== " ") {
        ctx.fillStyle = fgc;
        if (fl & 1) ctx.font = "bold " + TERM.font;
        else if (fl & 2) ctx.font = "italic " + TERM.font;
        else ctx.font = TERM.font;
        ctx.fillText(ch, x, y + 1);
      }
    }
  }
  if (g.show) {
    const cl = Math.min(g.cursor[0], g.rows - 1), cc = Math.min(g.cursor[1], g.cols - 1);
    ctx.fillStyle = "#58a6ff";
    ctx.fillRect(cc * TERM.cellW, cl * TERM.cellH, TERM.cellW, TERM.cellH);
    const cell = (g.cells[cl] || [])[cc];
    if (cell && cell[0] && cell[0] !== " ") {
      ctx.fillStyle = "#161b22";
      ctx.font = TERM.font;
      ctx.fillText(cell[0], cc * TERM.cellW, cl * TERM.cellH + 1);
    }
  }
}

function termSend(data) {
  if (TERM.socket && TERM.socket.readyState === 1) TERM.socket.send(data);
}

function termKey(e) {
  if (e.key === "Control" || e.key === "Shift" || e.key === "Alt" || e.key === "Meta") return;
  e.preventDefault();
  const k = e.key, ctrl = e.ctrlKey || e.metaKey, alt = e.altKey;
  let s = null;
  if (k === "Enter") s = "\r";
  else if (k === "Backspace") s = "\x7f";
  else if (k === "Tab") s = "\t";
  else if (k === "Escape") s = "\x1b";
  else if (k === "ArrowUp") s = "\x1b[A";
  else if (k === "ArrowDown") s = "\x1b[B";
  else if (k === "ArrowRight") s = "\x1b[C";
  else if (k === "ArrowLeft") s = "\x1b[D";
  else if (k === "Home") s = "\x1b[H";
  else if (k === "End") s = "\x1b[F";
  else if (k === "PageUp") s = "\x1b[5~";
  else if (k === "PageDown") s = "\x1b[6~";
  else if (k === "Insert") s = "\x1b[2~";
  else if (k === "Delete") s = "\x1b[3~";
  else if (k.startsWith("F") && /^F\d+$/.test(k)) {
    const n = parseInt(k.slice(1), 10);
    s = ["\x1bOP", "\x1bOQ", "\x1bOR", "\x1bOS", "\x1b[15~", "\x1b[17~", "\x1b[18~", "\x1b[19~", "\x1b[20~", "\x1b[21~", "\x1b[23~", "\x1b[24~"][n - 1] || null;
  } else if (ctrl && k.length === 1) {
    s = String.fromCharCode(k.toLowerCase().charCodeAt(0) - 96);
  } else if (alt && k.length === 1) {
    s = "\x1b" + k;
  } else if (k.length === 1) {
    s = k;
  }
  if (s === null || s === undefined) return;
  termSend(new TextEncoder().encode(s));
}

function showTerminal() {
  const body = document.getElementById("bbody");
  body.innerHTML = "";
  let cv = document.getElementById("termcanvas");
  if (!cv) {
    cv = document.createElement("canvas");
    cv.id = "termcanvas";
    cv.tabIndex = 0;
  }
  body.appendChild(cv);
  TERM.canvas = cv;
  TERM.ctx = cv.getContext("2d");
  termMeasure();
  cv.onkeydown = termKey;
  cv.onpaste = e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text");
    if (t) termSend(new TextEncoder().encode(t));
  };
  cv.onclick = () => cv.focus();
  if (TERM.ready && TERM.socket && TERM.socket.readyState <= 1) {
    fitTerminal();
    cv.focus();
    return;
  }
  connectTerminal();
}

function fitTerminal() {
  if (!TERM.canvas || !TERM.socket || TERM.socket.readyState !== 1) return;
  const d = termDims();
  TERM.socket.send("resize:" + d.cols + "x" + d.rows);
}

function connectTerminal() {
  const d = termDims();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  let wsUrl = proto + "//" + location.host + "/terms/ws?cols=" + d.cols + "&rows=" + d.rows;
  if (token) wsUrl += "&token=" + encodeURIComponent(token);
  let sock;
  try {
    sock = new WebSocket(wsUrl);
  } catch (e) {
    TERM.canvas.outerHTML = '<div class="logline err">terminal: cannot open socket</div>';
    return;
  }
  sock.binaryType = "arraybuffer";
  TERM.socket = sock;
  sock.onopen = () => { TERM.ready = true; TERM.canvas.focus(); };
  sock.onmessage = ev => {
    try {
      const frame = JSON.parse(ev.data);
      TERM.grid = frame;
      termDraw();
    } catch (e) {}
  };
  const dead = () => {
    TERM.ready = false;
    log("console", "terminal disconnected — reselect terminal to reconnect");
    msg("terminal disconnected", true);
  };
  sock.onclose = dead;
  sock.onerror = dead;
  window.onresize = () => { if (S.bottomTab === "terminal") fitTerminal(); };
}

function setBottomTab(t, silent) {
  S.bottomTab = t;
  document.querySelectorAll("#bottom .docktabs button").forEach(b => {
    b.classList.toggle("sel", b.dataset.btab === t);
  });
  if (!S.docks.bottom) toggleDock("bottom", true);
  if (silent) return;
  if (t === "problems") renderProblems();
  else if (t === "tasks") showTasks();
  else if (t === "search") runSearch();
  else if (t === "terminal") showTerminal();
  else renderConsole();
}

/* ============ docks ============ */
function toggleDock(which, force) {
  const on = force !== undefined ? force : !S.docks[which];
  S.docks[which] = on;
  document.getElementById(which === "bottom" ? "bottom" : which).classList.toggle("hidden", !on);
  document.getElementById("t-" + which).classList.toggle("on", on);
  saveLayout();
}

/* ============ clipboard ============ */
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function parentDir(p) {
  const r = rel(p);
  const i = r.lastIndexOf("/");
  return i < 0 ? "" : r.slice(0, i);
}

function askInput(opts) {
  return new Promise(resolve => {
    const wrap = document.getElementById("modalwrap");
    const modal = document.getElementById("modal");
    modal.innerHTML = "";
    const h = document.createElement("h3");
    h.textContent = opts.title;
    const input = document.createElement("input");

    input.value = opts.value || "";

    input.autocomplete = "off";
    const row = document.createElement("div");
    row.className = "row";
    const cancel = document.createElement("button");

    const ok = document.createElement("button");
    ok.textContent = opts.okLabel || "Create";

    else ok.classList.add("primary");

      wrap.classList.remove("open");
      wrap.onclick = null;
      resolve(v);
    };
    ok.onclick = () => {
      const v = input.value.trim();
      close(v ? v : null);
    };
    cancel.onclick = () => close(null);

      if (e.key === "Enter") { e.preventDefault(); ok.onclick(); }
      else if (e.key === "Escape") close(null);
      e.stopPropagation();
    };
    wrap.onclick = () => close(null);
    modal.onclick = e => e.stopPropagation();
    row.appendChild(cancel);
    row.appendChild(ok);
    modal.appendChild(h);
    modal.appendChild(input);
    modal.appendChild(row);
    wrap.classList.add("open");
    input.focus();
    input.select();
  });

function askConfirm(opts) {
  return new Promise(resolve => {
    const wrap = document.getElementById("modalwrap");
    const modal = document.getElementById("modal");

    const h = document.createElement("h3");

    const cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    const ok = document.createElement("button");
    ok.textContent = opts.okLabel || "Delete";
    ok.classList.add("danger");
    const close = v => {
      wrap.classList.remove("open");
      wrap.onclick = null;
      resolve(v);
    };
    ok.onclick = () => close(true);
    cancel.onclick = () => close(false);
    modal.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); close(true); }
      else if (e.key === "Escape") close(false);
      e.stopPropagation();
    };
    modal.tabIndex = 0;
    wrap.onclick = () => close(false);
    modal.onclick = e => e.stopPropagation();
    row.appendChild(cancel);

/* ============ fs ops from the tree ============ */
function trackTabForFs(oldAbs, makeNew) {
  // returns {closed: [...]} — caller refreshes tree first
  for (let i = S.tabs.length - 1; i >= 0; i--) {
    const t = S.tabs[i];
    if (t.path !== oldAbs && !t.path.startsWith(oldAbs + "/")) continue;
    if (makeNew === null) {
      S.tabs.splice(i, 1);
      if (S.active >= S.tabs.length) S.active = S.tabs.length - 1;
    } else {
      t.path = makeNew(t.path);
      t.label = null;
    }
  }
  if (S.tabs.length === 0) {
    S.active = -1;
    if (ED) ED.setDoc("");
    renderTabs();
  } else {
    if (S.active < 0) S.active = 0;
    activateTab(S.active);
  }
}
async function fsOp(op, body, after) {
  try {
    const j = await post(op, body);
    if (!j.ok) throw new Error(j.error || "failed");
    if (after) await after(j);
    await loadFiles();
    refreshGitCounts();
  } catch (e) { msg(String(e), true); }
}
function fileMenu(x, y, absPath, isDir) {
  const r = rel(absPath);
  const isRoot = !r;
  const items = [];
  const dir = isDir ? r : parentDir(absPath);
  items.push({ label: "New File", run: async () => {
    const name = await askInput({ title: "New file" + (dir ? " in " + dir : ""), placeholder: "name.ext" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: false });
  }});
  items.push({ label: "New Folder", run: async () => {
    const name = await askInput({ title: "New folder" + (dir ? " in " + dir : ""), placeholder: "name" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: true });
  }});
  if (isRoot) {
    items.push({ sep: true });
    items.push({ label: "Refresh", run: () => loadFiles() });
    items.push({ label: "Copy Root Path", run: () => copyText(absPath) });
    showMenu(x, y, items);
    return;
  }
  items.push({ sep: true });
  if (!isDir) {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop();
      const name = await askInput({ title: "Rename", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = dir ? dir + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
    items.push({ label: "Duplicate", run: () => fsOp("/fs/duplicate", { path: r }) });
  } else {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop() || r;
      const name = await askInput({ title: "Rename folder", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = parentDir(absPath) ? parentDir(absPath) + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
  }
  items.push({ label: "Delete", danger: true, run: async () => {
    const ok = await askConfirm({ title: "Delete " + (isDir ? "folder" : "file") + "?", body: r + (isDir ? " and everything inside it" : "") });
    if (ok) {
      await fsOp("/fs/delete", { path: r });
      trackTabForFs(absPath, null);
    }
  }});
  items.push({ sep: true });
  items.push({ label: "Copy Path", run: () => copyText(absPath) });
  items.push({ label: "Copy Relative Path", run: () => copyText(r) });
  if (!isDir) {
    items.push({ label: "Reveal in Tree", run: () => revealInTree(absPath) });
  } else {
    items.push({ label: "Refresh", run: () => loadFiles() });
  }
  showMenu(x, y, items);
}
async function renameTabs(oldAbs, newRel) {
  // server paths are absolute; rebuild tab path from the new relative path
  const ws = wsRoot ? wsRoot + "/" : "";
  for (const t of S.tabs) {
    if (t.path === oldAbs || t.path.startsWith(oldAbs + "/")) {
      const suffix = t.path.slice(oldAbs.length);
      t.path = ws + newRel + suffix;
    }
  }
  if (S.active >= 0) activateTab(S.active);
  else renderTabs();
}
let REVEAL = null;

  REVEAL = absPath;

  setLeftTabSilent("project");

/* ============ source control (vscode-style) ============ */
async function refreshGitCounts() {
  try {
    const list = await get("/git/status");
    const entries = list.entries || [];
    let staged = 0, unstaged = 0;
    entries.forEach(e => {
      if (e.staged && e.staged !== " " && e.staged !== "?") staged++;
      if (e.unstaged && e.unstaged !== " ") unstaged++;
    });
    document.getElementById("sgit").textContent =
      entries.length ? ("git +" + staged + " ~" + unstaged) : "git clean";
  } catch (e) {
    document.getElementById("sgit").textContent = "";
  }
}
function scmFileRow(body, entry, staged, onAction) {
  const d = document.createElement("div");
  d.className = "filerow";
  const badge = document.createElement("span");
  badge.className = "badge";
  const mark = staged ? entry.staged : entry.unstaged;
  badge.textContent = mark === " " ? "M" : mark;
  badge.style.color = mark === "?" ? "var(--ok)" : mark === "D" ? "var(--error)" : "var(--warn)";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = entry.path;
  nm.title = entry.path;
  const act = document.createElement("span");
  act.className = "act";
  onAction.forEach(a => {
    const b = document.createElement("button");
    b.textContent = a[0];
    b.title = a[1];
    b.onclick = ev => { ev.stopPropagation(); a[2](); };
    act.appendChild(b);
  });
  d.appendChild(badge);
  d.appendChild(nm);
  d.appendChild(act);
  d.onclick = () => openFile(entry.path, 0).catch(e => msg(String(e), true));
  body.appendChild(d);
}
async function loadScm() {
  const body = document.getElementById("leftbody");
  body.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.id = "scm";
  const msg2 = document.createElement("textarea");
  msg2.placeholder = "Message (Ctrl+Enter to commit)";
  const commitBtn = document.createElement("button");
  commitBtn.className = "commitbtn";
  commitBtn.textContent = "Commit";
  commitBtn.disabled = true;
  msg2.addEventListener("input", () => { commitBtn.disabled = !msg2.value.trim(); });
  msg2.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && msg2.value.trim()) {
      e.preventDefault();
      doCommit();
    }
  });
  async function doCommit() {
    const m = msg2.value.trim();
    if (!m) return;
    try {
      const j = await post("/git/commit", { message: m });
      if (!j.ok) throw new Error(j.error || "commit failed");
      msg2.value = "";
      commitBtn.disabled = true;
      log("console", "committed: " + m.split("\n")[0]);
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  }
  commitBtn.onclick = doCommit;
  wrap.appendChild(msg2);
  wrap.appendChild(commitBtn);
  const branchRow = document.createElement("div");
  branchRow.style.cssText = "display:flex;gap:6px;align-items:center;";
  const sel = document.createElement("select");
  const newBtn = document.createElement("button");
  newBtn.className = "mini";
  newBtn.textContent = "+ branch";
  newBtn.onclick = async () => {
    const name = await askInput({ title: "New branch", placeholder: "feature/name", okLabel: "Create" });
    if (!name) return;
    try {
      const j = await post("/git/switch", { branch: name, create: true });
      if (!j.ok) throw new Error(j.error || "failed");
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  };
  branchRow.appendChild(sel);
  branchRow.appendChild(newBtn);
  wrap.appendChild(branchRow);
  const stashRow = document.createElement("div");
  stashRow.style.cssText = "display:flex;gap:6px;";
  const stashBtn = document.createElement("button");
  stashBtn.className = "mini";
  stashBtn.textContent = "stash changes";
  stashBtn.onclick = async () => {
    const m = await askInput({ title: "Stash message (optional)", placeholder: "wip", okLabel: "Stash" });
    if (m === null) return;
    try {
      const j = await post("/git/stash", { message: m || "" });
      if (!j.ok) throw new Error(j.error || "failed");
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  };
  const popBtn = document.createElement("button");
  popBtn.className = "mini";
  popBtn.textContent = "pop stash";
  popBtn.onclick = async () => {
    try {
      const j = await post("/git/stash", { pop: true });
      if (!j.ok) throw new Error(j.error || "failed");
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  };
  stashRow.appendChild(stashBtn);
  stashRow.appendChild(popBtn);
  wrap.appendChild(stashRow);
  body.appendChild(wrap);
  async function reloadScm() {
    try {
      const [st, br] = await Promise.all([get("/git/status"), get("/git/branches")]);
      const entries = st.entries || [];
      sel.innerHTML = "";
      (br.entries || []).forEach(b => {
        const o = document.createElement("option");
        o.value = b.name;
        o.textContent = (b.current ? "● " : "") + b.name;
        if (b.current) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = async () => {
        try {
          const j = await post("/git/switch", { branch: sel.value });
          if (!j.ok) throw new Error(j.error || "failed");
          await reloadScm();
        } catch (e) { msg(String(e), true); }
      };
      wrap.querySelectorAll(".staged-sec,.changes-sec").forEach(el => el.remove());
      const staged = entries.filter(e => e.staged && e.staged !== " " && e.staged !== "?");
      const changes = entries.filter(e => e.unstaged && e.unstaged !== " ");
      const mkSec = (title, list, stagedFlag) => {
        const sec = document.createElement("div");
        sec.className = stagedFlag ? "staged-sec" : "changes-sec";
        const h = document.createElement("h4");
        const span = document.createElement("span");
        span.textContent = title + " ";
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = list.length;
        h.appendChild(span);
        h.appendChild(n);
        sec.appendChild(h);
        if (!list.length) {
          const em = document.createElement("div");
          em.className = "logline";
          em.textContent = stagedFlag ? "(nothing staged)" : "(working tree clean)";
          sec.appendChild(em);
        }
        list.forEach(e => {
          scmFileRow(sec, e, stagedFlag, stagedFlag
            ? [["−", "unstage", async () => {
                const j = await post("/git/unstage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }]]
            : [["+", "stage", async () => {
                const j = await post("/git/stage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }], ["⟲", "discard changes", async () => {
                const ok = await askConfirm({ title: "Discard changes?", body: e.path, okLabel: "Discard" });
                if (!ok) return;
                const j = await post("/git/discard", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
                loadFiles();
              }]]);
        });
        wrap.appendChild(sec);
      };
      mkSec("staged", staged, true);
      mkSec("changes", changes, false);
      refreshGitCounts();
      health();
    } catch (e) { msg(String(e), true); }
  }
  await reloadScm();
}

function palFilter(q) {

    .filter(c => !q || c[0].toLowerCase().includes(q))

document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "p") { e.preventDefault(); palOpen(e.shiftKey); }
  else if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen(false); }
  else if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); toggleDock("left"); }
  else if (mod && e.key.toLowerCase() === "s") {
    if (document.activeElement && document.activeElement.id !== "editorwrap" && !document.activeElement.classList.contains("cm-content")) {
      e.preventDefault();
      saveActive();
    }
  } else if (e.key === "Escape") {
    if (document.getElementById("palwrap").classList.contains("open")) palClose();
  }
});

/* ============ boot ============ */
(async function boot() {
  loadLayout();
  toggleDock("left", S.docks.left);
  toggleDock("right", S.docks.right);
  toggleDock("bottom", S.docks.bottom);
  const m = /[?&]token=([^&]*)/.exec(location.search);
  if (m) {
    token = decodeURIComponent(m[1]);
    document.getElementById("token").value = token;
  }
  await bootEditor();
  health();
  loadFiles();
  renderProblems();
  log("console", "keplr web ui ready");
})();
</script>
