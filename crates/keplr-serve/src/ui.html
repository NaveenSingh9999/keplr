<style>

}
  * { box-sizing: border-box; }
  * {

  html, body { height: 100%; }

  .md { max-width: 860px; margin: 0 auto; padding: 24px 32px 60px; line-height: 1.65; font-size: 14px; }

  .md h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }

  #crumbs .vtoggle.on { color: var(--accent); border-color: var(--accent); }

  /* ---- bottom dock ---- */

  /* ---- source control ---- */

  }
  #scm textarea:focus { border-color: var(--accent); }
  #scm .commitbtn {
    background: var(--accent); color: #04101f; border: none; font-weight: bold;
    border-radius: 6px; font: inherit; padding: 6px; cursor: pointer;
  }
  #scm .commitbtn:disabled { opacity: .45; cursor: default; }
  #scm h4 { margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: normal; display: flex; align-items: center; gap: 6px; }
  #scm h4 .n { background: var(--border); border-radius: 8px; padding: 0 7px; font-size: 11px; }

  #scm .filerow .act button {
    background: none; border: none; color: var(--dim);

  }
  #scm .filerow .act button:hover { color: var(--text); background: var(--surface2); }
  #scm select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; font: inherit; max-width: 100%;
  }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button { transition: background-color .12s, color .12s; }
  .trow, .tab, #files div { transition: background-color .12s; }
  /* ---- suggest widget (inline completions) ---- */
  #suggest {

  }

  }
  #suggest .sg.sel { background: var(--border); color: var(--accent); }

  /* ---- settings panel ---- */
  #settingswrap {
    display: none; position: fixed; top: 0; right: 0; bottom: 0; z-index: 22;
    width: min(380px, 92vw); background: var(--surface);

  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; } }

  #leftbody, #bbody, #symbols, #files { scroll-behavior: smooth; }

    *, *::before, *::after { animation: none !important; transition: none !important; }
    #leftbody, #bbody, #symbols, #files { scroll-behavior: auto; }
  }
  body.noanim *, body.noanim *::before, body.noanim *::after { animation: none !important; transition: none !important; }
  body.noanim #leftbody, body.noanim #bbody, body.noanim #symbols, body.noanim #files { scroll-behavior: auto; }
  body.noblink .cm-cursor, body.noblink .cm-fat-cursor { animation: none !important; }
  body.calm .cm-cursor, body.calm .cm-fat-cursor { animation: none !important; }
  body.calm #leftbody, body.calm #bbody, body.calm #symbols, body.calm #files { scroll-behavior: auto; }

  /* ============ KEPLR DESIGN SYSTEM (native primitives) ============ */
  html { color-scheme: dark; }
  body {
    font: 400 var(--fs-ui)/1.45 var(--font-ui);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *:hover { scrollbar-color: rgba(255,255,255,.16) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-track { background: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: var(--r-sm); }
  @supports (corner-shape: squircle) {
    .kbtn, .kmenu, .kinput, .ktoast, .kseg { corner-shape: squircle; }
  }
  @media (pointer: coarse) {
    .kbtn, .kinput, select.kinput { min-height: 44px; }
    .kicon { width: 44px; height: 44px; }
  }
  .ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
  .kbtn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: var(--h-ctl); padding: 0 12px; border-radius: var(--r-sm);
    background: var(--raised); color: var(--text); border: 1px solid var(--sep);
    font: 500 var(--fs-ui) var(--font-ui); cursor: pointer; white-space: nowrap;
    transition: transform var(--d1) var(--ease), background var(--d1) var(--ease), border-color var(--d1) var(--ease), filter var(--d1) var(--ease);
  }
  .kbtn:hover { background: var(--pressed); border-color: rgba(255,255,255,.14); }
  .kbtn:active { transform: scale(.97); }

<script type="module">
import { EditorView, basicSetup } from "codemirror";

/* ============ transport ============ */
let token = "";
let wsRoot = "";
function url(path) {
  const q = token ? ((path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token)) : "";
  return path + q;
}
async function get(path) {
  const r = await fetch(url(path));
  if (r.status === 401) { openUnlock(); throw new Error("locked — unlock to continue"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(url(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (r.status === 401) { openUnlock(); throw new Error("locked — unlock to continue"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
/* Token gating without a permanent input: Unlock sheet on 401,
   remembered per host. */
function tokenKey() { return "keplr-token-" + location.host; }
let unlockOpen = false;
function updateLock() {
  const b = document.getElementById("slockbtn");
  if (b) b.classList.toggle("on", !!token);
}
function openUnlock() {
  if (unlockOpen) return;
  unlockOpen = true;
  const wrap = document.getElementById("modalwrap");
  const modal = document.getElementById("modal");
  modal.innerHTML = "";
  const h = document.createElement("h3");
  h.textContent = "Unlock workspace";
  const p = document.createElement("p");
  p.textContent = "This server is token-gated. Paste the token once — it stays on this host.";
  p.style.cssText = "color:var(--text2);font-size:13px;margin:0 0 10px;";
  const input = document.createElement("input");
  input.type = "password";
  input.className = "kinput";
  input.placeholder = "token";
  input.style.width = "100%";
  input.autocomplete = "off";
  const lab = document.createElement("label");
  lab.style.cssText = "display:flex;gap:8px;align-items:center;color:var(--text2);font-size:13px;margin:10px 0;";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.className = "kswitch";
  box.checked = true;
  lab.appendChild(box);
  lab.appendChild(document.createTextNode("Remember on this host"));
  const row = document.createElement("div");
  row.className = "row";
  row.style.justifyContent = "flex-end";
  const cancel = document.createElement("button");
  cancel.className = "kbtn";
  cancel.textContent = "Cancel";
  const ok = document.createElement("button");
  ok.className = "kbtn kbtn-acc";
  ok.textContent = "Unlock";
  const close = () => {
    wrap.classList.remove("open");
    wrap.onclick = null;
    unlockOpen = false;
  };
  ok.onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    token = v;
    try {
      if (box.checked) localStorage.setItem(tokenKey(), token);
      else localStorage.removeItem(tokenKey());
    } catch (e) {}
    updateLock();
    close();
    health();
    loadFiles();
  };
  cancel.onclick = close;
  input.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); ok.onclick(); }
    else if (e.key === "Escape") close();
    e.stopPropagation();
  };
  row.appendChild(cancel);
  row.appendChild(ok);
  modal.appendChild(h);
  modal.appendChild(p);
  modal.appendChild(input);
  modal.appendChild(lab);
  modal.appendChild(row);
  wrap.classList.add("open");
  wrap.onclick = e => { if (e.target === wrap) close(); };
  input.focus();
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function rel(p) {
  if (wsRoot && (p === wsRoot || p.startsWith(wsRoot + "/"))) {
    return p.slice(wsRoot.length + 1) || p;
  }
  return p;
}

/* ============ icons (inline SVG, no assets) ============ */
const LANG_COLORS = {
  rust: "#cf8a68", python: "#7ba7cc", typescript: "#6f9fd0", tsx: "#6f9fd0",
  javascript: "#c2b25e", cpp: "#c97b8e", c: "#8a8f98", csharp: "#6fae7f",
  go: "#5fb3c9", java: "#bd8a55", swift: "#d1705e", kotlin: "#a88fd0",
  ruby: "#b25e5e", php: "#8a93b8", html: "#cf7a52", css: "#8a7fc0",
  json: "#b0b06a", toml: "#b07a55", yaml: "#c05a5a", markdown: "#9aa3b2",
  shell: "#8fc46a", sql: "#d09a4e", lua: "#7a7ab8", laml: "#5aa9ff", text: "#8D8D93"
};
function fileIcon(lang, name) {
  const c = LANG_COLORS[lang] || LANG_COLORS.text;
  const label = (lang || "txt").slice(0, 3);
  return `<svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.5" fill="none" stroke="${c}" stroke-width="1.4"/><text x="8" y="10.5" font-size="5" text-anchor="middle" fill="${c}" font-family="monospace">${esc(label)}</text></svg>`;
}
function fileIconFor(path) {
  const k = previewKind(path);
  if (k === "pdf") return fileIconPdf();
  if (k === "img") return fileIconImg();
  return fileIcon(langOf(path));
}
function fileIconPdf() {
  return `<svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.5" fill="none" stroke="#FF453A" stroke-width="1.4"/><text x="8" y="10.5" font-size="4.5" text-anchor="middle" fill="#FF453A" font-family="monospace">PDF</text></svg>`;
}
function fileIconImg() {
  return `<svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="#BF5AF2" stroke-width="1.3"/><circle cx="5.5" cy="6.5" r="1.2" fill="#BF5AF2"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3z" fill="#BF5AF2" opacity="0.7"/></svg>`;
}
const FOLDER_CLOSED = `<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 4.5c0-.8.7-1.5 1.5-1.5h3l1.5 2h6c.8 0 1.5.7 1.5 1.5v5c0 .8-.7 1.5-1.5 1.5h-11c-.8 0-1.5-.7-1.5-1.5z" fill="none" stroke="#8D8D93" stroke-width="1.3"/></svg>`;
const FOLDER_OPEN = `<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 3h4l1.5 2h7.5c.8 0 1.5.7 1.5 1.5v1h-13v-3c0-.8.7-1.5 1.5-1.5z" fill="#1F1F22" stroke="#8D8D93" stroke-width="1.1"/><rect x="1.5" y="7.5" width="13" height="5" rx="1" fill="#1F1F22" stroke="#8D8D93" stroke-width="1.1"/></svg>`;
/* Design-system icon: <use> from the sprite. Usage: icon("search") */
function icon(name, cls) {
  return `<svg class="ic ${cls || ""}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

/* ============ state ============ */
const S = {
  groups: [{tabs: [], active: -1}],
  focus: 0,
  files: [],           // rel paths
  leftTab: "project",
  bottomTab: "search",
  problems: [],
  palSel: 0,
  palItems: [],
  palSearch: [],
  symCache: null,
  gitStatus: {},
  cursorLine: 1,
  marks: null,
  log: [],
  docks: { left: true, right: false, bottom: false },
  layout: { left: 264, right: 232, bottom: 192 },
};
function G() { return S.groups[S.focus]; }
function A() { const g = G(); return g.tabs[g.active] || null; }
function saveLayout() {
  try { localStorage.setItem("keplr-layout", JSON.stringify({ docks: S.docks, layout: S.layout })); } catch (e) {}
}
function loadLayout() {
  try {
    const l = JSON.parse(localStorage.getItem("keplr-layout") || "null");
    if (l) {
      if (l.docks) S.docks = Object.assign(S.docks, l.docks);
      if (l.layout) S.layout = Object.assign(S.layout, l.layout);
    }
  } catch (e) {}
}
/* Resizable dock splitters: hairline look, 8px grab, snap-collapse, dblclick reset. */
function applyLayout() {
  const L = { left: 264, right: 232, bottom: 192 };
  S.layout = Object.assign({}, L, S.layout);
  const left = document.getElementById("left");
  const right = document.getElementById("right");
  const bottom = document.getElementById("bottom");
  if (left && S.docks.left) left.style.width = S.layout.left + "px";
  if (right && S.docks.right) right.style.width = S.layout.right + "px";
  if (bottom && S.docks.bottom) bottom.style.height = S.layout.bottom + "px";
  const sL = document.getElementById("splitL");
  const sR = document.getElementById("splitR");
  const sB = document.getElementById("splitB");
  if (sL) sL.style.display = S.docks.left ? "" : "none";
  if (sR) sR.style.display = S.docks.right ? "" : "none";
  if (sB) sB.style.display = S.docks.bottom ? "" : "none";
  moveDockIndicator();
}
function resetLayout() {
  S.layout = { left: 264, right: 232, bottom: 192 };
  applyLayout();
  saveLayout();
}
function dragSplit(el, axis, opts) {
  // opts: {get(), set(v), min, max, dir, collapse()}
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    el.classList.add("drag");
    const start = axis === "x" ? e.clientX : e.clientY;
    const base = opts.get();
    const move = ev => {
      const d = ((axis === "x" ? ev.clientX : ev.clientY) - start) * opts.dir;
      opts.set(Math.max(opts.min, Math.min(opts.max, base + d)));
    };
    const up = ev => {
      el.classList.remove("drag");
      const d = ((axis === "x" ? ev.clientX : ev.clientY) - start) * opts.dir;
      if (base + d < 72) opts.collapse();
      saveLayout();
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
  el.addEventListener("dblclick", resetLayout);
}
function initSplitters() {
  if (document.getElementById("splitL")) return;
  const wb = document.getElementById("workbench");
  const center = document.getElementById("center");
  const right = document.getElementById("right");
  const mk = (id, cls) => {
    const d = document.createElement("div");
    d.id = id;
    d.className = "ksplit " + cls;
    return d;
  };
  const sL = mk("splitL", "v");
  wb.insertBefore(sL, center);
  const sR = mk("splitR", "v");
  wb.insertBefore(sR, right);
  const bottom = document.getElementById("bottom");
  const sB = mk("splitB", "h");
  bottom.parentNode.insertBefore(sB, bottom);
  const left = () => document.getElementById("left");
  const rightEl = () => document.getElementById("right");
  const bottomEl = () => document.getElementById("bottom");
  dragSplit(sL, "x", {
    dir: 1, min: 72, max: 560,
    get: () => S.layout.left,
    set: v => { S.layout.left = v; left().style.width = v + "px"; },
    collapse: () => toggleDock("left", false),
  });
  dragSplit(sR, "x", {
    dir: -1, min: 72, max: 560,
    get: () => S.layout.right,
    set: v => { S.layout.right = v; rightEl().style.width = v + "px"; },
    collapse: () => toggleDock("right", false),
  });
  dragSplit(sB, "y", {
    dir: -1, min: 72, max: 600,
    get: () => S.layout.bottom,
    set: v => { S.layout.bottom = v; bottomEl().style.height = v + "px"; },
    collapse: () => toggleDock("bottom", false),
  });
  applyLayout();
}
function langOf(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  const map = {
    ts: "typescript", tsx: "tsx", js: "javascript", jsx: "javascript",
    cpp: "cpp", cc: "cpp", cxx: "cpp", h: "cpp", hpp: "cpp",
    go: "go", rs: "rust", lm: "laml", py: "python", c: "c", cs: "csharp",
    java: "java", swift: "swift", kt: "kotlin", kts: "kotlin", rb: "ruby",
    php: "php", html: "html", htm: "html", css: "css", json: "json",
    toml: "toml", yaml: "yaml", yml: "yaml", md: "markdown", sh: "shell",
    bash: "shell", sql: "sql", lua: "lua"
  };

function previewKind(path) {

function mdInline(src) {

  src = src.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  src = src.replace(/\[([^\]]+)\]\(([^)\s]*)\)/g, "$1");
  src = src.replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1");
  src = src.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');

  src = src.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  src = src.replace(/(^|[\s(>])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  src = src.replace(/(^|[\s(>])_([^_\n]+)_/g, "$1<em>$2</em>");
  src = src.replace(/~~([^~]+)~~/g, "<del>$1</del>");

}
function mdRender(text) {

  const closeLists = to => {
    while (listStack.length && listStack[listStack.length - 1].indent >= to) {

  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^(`{3,}|~{3,})\s*([\w+-]*)\s*$/);

      if (!inFence) {
        inFence = true;
        fenceLang = fence[2] || "";
        fenceBuf = [];
      } else {
        inFence = false;
        html += "<pre>" + (fenceLang ? '<span class="codelang">' + esc(fenceLang) + "</span>" : "") + "<code>" + esc(fenceBuf.join("\n")) + "</code></pre>";
      }
      i++;
      continue;
    }
    if (inFence) {
      fenceBuf.push(line);
      i++;
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushPara(para); para = [];
      closeLists(0);
      const lvl = heading[1].length;
      html += "<h" + lvl + ">" + mdInline(heading[2]) + "</h" + lvl + ">";
      i++;
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushPara(para); para = [];

      html += "<hr>";
      i++;
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {

      closeLists(0);
      const cells = line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      html += "<table><thead><tr>" + cells.map(c => "<th>" + mdInline(c) + "</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const row = lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        html += "<tr>" + row.map(c => "<td>" + mdInline(c) + "</td>").join("") + "</tr>";

    }
    const task = line.match(/^(\s*)([-*+]|\d+[.)])\s+\[([ xX])\]\s+(.*)$/);
    const item = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (task || item) {
      flushPara(para); para = [];
      const m = task || item;
      const indent = m[1].replace(/\t/g, "    ").length;
      const ordered = /^\d/.test(m[2]);

      if (!listStack.length || listStack[listStack.length - 1].indent < indent) {

        listStack.push({ indent: indent, ordered: ordered });
      }
      if (task) {
        const checked = task[3].toLowerCase() === "x";
        html += '<li class="task"><input type="checkbox" disabled' + (checked ? " checked" : "") + "> " + mdInline(task[4]) + "</li>";
      } else {
        html += "<li>" + mdInline(item[3]) + "</li>";
      }
      i++;
      continue;
    }
    if (/^\s*$/.test(line)) {
      flushPara(para); para = [];
      closeLists(0);
      i++;
      continue;
    }
    para.push(line.trim() + (/ {2}\s*$/.test(line) ? "\0BR\0" : ""));

}

        if (r.dataset.path) openFile(r.dataset.path, 0).catch(err => msg(String(err), true));
      }
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const r = rows[cur];
      if (r && r.dataset.dir) {

        if ((e.key === "ArrowRight") === closed) { e.preventDefault(); r.click(); }

      const now = Date.now();
      if (now - treeFindT > 800) treeFindBuf = "";
      treeFindT = now;
      treeFindBuf += e.key.toLowerCase();

      if (hit) treeFocusRow(hit);

/* ============ terminal (canvas, alacritty_terminal grid) ============ */
const TERM = { sessions: [], active: -1, n: 0, strip: null, holder: null, cellW: 8, cellH: 16, font: "" };

function termActive() {
  if (TERM.active < 0 || TERM.active >= TERM.sessions.length) return null;
  return TERM.sessions[TERM.active];
}

function termFont(px) {
  return px + 'px "SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace';
}

function termMeasure() {
  const px = (S.settings && S.settings.terminalFontSize) || 13;
  const c = document.createElement("canvas").getContext("2d");
  c.font = termFont(px);
  TERM.cellW = Math.max(5, Math.ceil(c.measureText("M").width));
  TERM.cellH = Math.ceil(px * 1.4);
  TERM.font = termFont(px);
}
window.__termRefresh = function () {
  const s = termActive();
  if (!s || !s.canvas) return;
  termMeasure();
  if (s.socket && s.socket.readyState === 1) {
    const d = termDims();
    s.socket.send("resize:" + d.cols + "x" + d.rows);
  }
  if (s.grid && TERM.sessions[TERM.active] === s) termDraw();
};

function termDims() {
  const body = document.getElementById("bbody");
  const w = Math.max(80, body.clientWidth - 28);
  const h = Math.max(60, body.clientHeight - 16);
  return {
    cols: Math.max(20, Math.floor(w / TERM.cellW)),
    rows: Math.max(5, Math.floor(h / TERM.cellH)),
    w: w,
    h: h
  };
}

function termDraw() {
  const s = termActive();
  if (!s || !s.ctx || !s.grid) return;
  const g = s.grid;
  const ctx = s.ctx;
  const cv = s.canvas;
  const dpr = window.devicePixelRatio || 1;
  const W = g.cols * TERM.cellW, H = g.rows * TERM.cellH;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#161b22";
  ctx.fillRect(0, 0, W, H);
  ctx.font = TERM.font;
  ctx.textBaseline = "top";
  for (let l = 0; l < g.rows; l++) {
    const row = g.cells[l];
    if (!row) continue;
    for (let c = 0; c < g.cols; c++) {
      const cell = row[c];
      if (!cell) continue;
      const x = c * TERM.cellW, y = l * TERM.cellH;
      const ch = cell[0], fg = cell[1], bg = cell[2], fl = cell[3];
      let fgc = fg || "#e6edf3";
      let bgc = bg;
      if (fl & 4) { const t = fgc; fgc = bgc || "#161b22"; bgc = t === "#e6edf3" ? null : t; }
      if (bgc) { ctx.fillStyle = bgc; ctx.fillRect(x, y, TERM.cellW, TERM.cellH); }
      if (ch && ch !== " ") {
        ctx.fillStyle = fgc;
        if (fl & 1) ctx.font = "bold " + TERM.font;
        else if (fl & 2) ctx.font = "italic " + TERM.font;
        else ctx.font = TERM.font;
        ctx.fillText(ch, x, y + 1);
      }
    }
  }
  if (g.show) {
    const cl = Math.min(g.cursor[0], g.rows - 1), cc = Math.min(g.cursor[1], g.cols - 1);
    ctx.fillStyle = "#58a6ff";
    ctx.fillRect(cc * TERM.cellW, cl * TERM.cellH, TERM.cellW, TERM.cellH);
    const cell = (g.cells[cl] || [])[cc];
    if (cell && cell[0] && cell[0] !== " ") {
      ctx.fillStyle = "#161b22";
      ctx.font = TERM.font;
      ctx.fillText(cell[0], cc * TERM.cellW, cl * TERM.cellH + 1);
    }
  }
}

function termSend(data) {
  const s = termActive();
  if (s && s.socket && s.socket.readyState === 1) s.socket.send(data);
}

function termKey(e) {
  if (e.key === "Control" || e.key === "Shift" || e.key === "Alt" || e.key === "Meta") return;
  e.preventDefault();
  const k = e.key, ctrl = e.ctrlKey || e.metaKey, alt = e.altKey;
  let s = null;
  if (k === "Enter") s = "\r";
  else if (k === "Backspace") s = "\x7f";
  else if (k === "Tab") s = "\t";
  else if (k === "Escape") s = "\x1b";
  else if (k === "ArrowUp") s = "\x1b[A";
  else if (k === "ArrowDown") s = "\x1b[B";
  else if (k === "ArrowRight") s = "\x1b[C";
  else if (k === "ArrowLeft") s = "\x1b[D";
  else if (k === "Home") s = "\x1b[H";
  else if (k === "End") s = "\x1b[F";
  else if (k === "PageUp") s = "\x1b[5~";
  else if (k === "PageDown") s = "\x1b[6~";
  else if (k === "Insert") s = "\x1b[2~";
  else if (k === "Delete") s = "\x1b[3~";
  else if (k.startsWith("F") && /^F\d+$/.test(k)) {
    const n = parseInt(k.slice(1), 10);
    s = ["\x1bOP", "\x1bOQ", "\x1bOR", "\x1bOS", "\x1b[15~", "\x1b[17~", "\x1b[18~", "\x1b[19~", "\x1b[20~", "\x1b[21~", "\x1b[23~", "\x1b[24~"][n - 1] || null;
  } else if (ctrl && k.length === 1) {
    s = String.fromCharCode(k.toLowerCase().charCodeAt(0) - 96);
  } else if (alt && k.length === 1) {
    s = "\x1b" + k;
  } else if (k.length === 1) {
    s = k;
  }
  if (s === null || s === undefined) return;
  termSend(new TextEncoder().encode(s));
}

function showTerminal() {
  const body = document.getElementById("bbody");
  body.innerHTML = "";
  const strip = document.createElement("div");
  strip.id = "termstrip";
  strip.style.cssText = "display:flex;gap:4px;align-items:center;padding:2px 4px;flex:none;overflow-x:auto;";
  body.appendChild(strip);
  const holder = document.createElement("div");
  holder.id = "termholder";
  holder.style.cssText = "flex:1;min-height:0;overflow:auto;position:relative;";
  body.appendChild(holder);
  TERM.strip = strip;
  TERM.holder = holder;
  termMeasure();
  for (const s of TERM.sessions) {
    s.canvas.style.display = "none";
    holder.appendChild(s.canvas);
  }
  renderTermTabs();
  if (TERM.active < 0 || !TERM.sessions[TERM.active]) {
    if (TERM.sessions.length) activateTerm(0);
    else newTerm();
  } else {
    activateTerm(TERM.active);
  }
}

function renderTermTabs() {
  const strip = TERM.strip;
  if (!strip) return;
  strip.innerHTML = "";
  TERM.sessions.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "tab" + (i === TERM.active ? " sel" : "");
    const nm = document.createElement("span");
    nm.textContent = s.name + (s.ready ? "" : " (dead)");
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "×";
    x.onclick = ev => { ev.stopPropagation(); closeTerm(i); };
    d.appendChild(nm);
    d.appendChild(x);
    d.onclick = () => activateTerm(i);
    strip.appendChild(d);
  });
  const add = document.createElement("button");
  add.className = "mini";
  add.textContent = "+";
  add.title = "new terminal (independent shell)";
  add.onclick = () => newTerm();
  strip.appendChild(add);
}

function activateTerm(i) {
  if (i < 0 || i >= TERM.sessions.length) return;
  TERM.active = i;
  for (let k = 0; k < TERM.sessions.length; k++) {
    TERM.sessions[k].canvas.style.display = k === i ? "" : "none";
  }
  renderTermTabs();
  if (TERM.sessions[i].grid) termDraw();
  fitTerminal();
  TERM.sessions[i].canvas.focus();
}

function closeTerm(i) {
  const s = TERM.sessions[i];
  if (!s) return;
  try { if (s.socket) s.socket.close(); } catch (e) {}
  if (s.canvas && s.canvas.parentNode) s.canvas.parentNode.removeChild(s.canvas);
  TERM.sessions.splice(i, 1);
  if (TERM.active >= TERM.sessions.length) TERM.active = TERM.sessions.length - 1;
  if (!TERM.sessions.length) { TERM.active = -1; newTerm(); return; }
  activateTerm(Math.max(0, TERM.active));
}

function newTerm() {
  connectTerminal();
}

function fitTerminal() {
  const s = termActive();
  if (!s || !s.canvas || !s.socket || s.socket.readyState !== 1) return;
  const d = termDims();
  s.socket.send("resize:" + d.cols + "x" + d.rows);
}

function connectTerminal() {
  const d = termDims();
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  let wsUrl = proto + "//" + location.host + "/terms/ws?cols=" + d.cols + "&rows=" + d.rows;
  if (token) wsUrl += "&token=" + encodeURIComponent(token);
  TERM.n += 1;
  const cv = document.createElement("canvas");
  cv.tabIndex = 0;
  cv.onkeydown = termKey;
  cv.onpaste = e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData("text");
    if (t) termSend(new TextEncoder().encode(t));
  };
  cv.onclick = () => cv.focus();
  const s = {
    id: "t" + Date.now() + "_" + TERM.n,
    name: "term " + TERM.n,
    socket: null, grid: null, canvas: cv, ctx: cv.getContext("2d"), ready: false
  };
  TERM.sessions.push(s);
  if (TERM.holder) { cv.style.display = "none"; TERM.holder.appendChild(cv); }
  let sock;
  try {
    sock = new WebSocket(wsUrl);
  } catch (e) {
    renderTermTabs();
    msg("terminal: cannot open socket", true);
    return;
  }
  sock.binaryType = "arraybuffer";
  s.socket = sock;
  TERM.active = TERM.sessions.length - 1;
  renderTermTabs();
  activateTerm(TERM.active);
  sock.onopen = () => { s.ready = true; renderTermTabs(); cv.focus(); };
  sock.onmessage = ev => {
    try {
      const frame = JSON.parse(ev.data);
      s.grid = frame;
      if (TERM.sessions[TERM.active] === s) termDraw();
    } catch (e) {}
  };
  const dead = () => {
    s.ready = false;
    renderTermTabs();
    if (TERM.sessions[TERM.active] === s) {
      log("console", s.name + " disconnected — open a new one with +");
      msg("terminal disconnected", true);
    }
  };
  sock.onclose = dead;
  sock.onerror = dead;
  window.onresize = () => { if (S.bottomTab === "terminal") fitTerminal(); };
}

/* ============ serial monitor ============ */
const SER = { socket: null, connected: false };
function showSerial() {
  const body = document.getElementById("bbody");
  body.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;height:100%;gap:6px;padding:6px;";
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;";
  const portSel = document.createElement("select");
  const baudSel = document.createElement("select");
  [9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600].forEach(b => {
    const o = document.createElement("option");
    o.value = String(b);
    o.textContent = String(b);
    if (b === 115200) o.selected = true;
    baudSel.appendChild(o);
  });
  const refBtn = document.createElement("button");
  refBtn.className = "mini";
  refBtn.textContent = "refresh";
  refBtn.onclick = () => loadPorts();
  const connBtn = document.createElement("button");
  connBtn.className = "mini";
  connBtn.textContent = "Connect";
  const nl = document.createElement("label");
  const nlBox = document.createElement("input");
  nlBox.type = "checkbox";
  nlBox.checked = true;
  nl.appendChild(nlBox);
  nl.appendChild(document.createTextNode(" +newline"));
  const out = document.createElement("pre");
  out.style.cssText = "flex:1;min-height:60px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;margin:0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;";
  const sendRow = document.createElement("div");
  sendRow.style.cssText = "display:flex;gap:6px;flex:none;";
  const inp = document.createElement("input");
  inp.placeholder = "type to send… (Enter)";
  inp.style.cssText = "flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font:inherit;";
  const sendBtn = document.createElement("button");
  sendBtn.className = "mini";
  sendBtn.textContent = "Send";
  function slog(t, err) {
    const d = document.createElement("div");
    if (err) d.style.color = "var(--error)";
    d.textContent = t;
    out.appendChild(d);
    while (out.children.length > 500) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;
  }
  function slogRaw(t) {
    const d = document.createElement("span");
    d.textContent = t;
    out.appendChild(d);
    while (out.children.length > 500) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;
  }
  async function loadPorts() {
    try {
      const j = await get("/serial/ports");
      if (j.error) { slog("ports: " + j.error, true); return; }
      portSel.innerHTML = "";
      (j.ports || []).forEach(p => {
        const o = document.createElement("option");
        o.value = p;
        o.textContent = p;
        portSel.appendChild(o);
      });
      if (!j.ports || !j.ports.length) slog("no serial ports found (need dialout permission?)");
    } catch (e) { slog(String(e), true); }
  }
  function setConn(on) {
    SER.connected = on;
    connBtn.textContent = on ? "Disconnect" : "Connect";
  }
  connBtn.onclick = () => {
    if (SER.connected) {
      try { SER.socket.send("close"); } catch (e) {}
      try { SER.socket.close(); } catch (e) {}
      setConn(false);
      slog("disconnected");
      return;
    }
    const port = portSel.value, baud = baudSel.value;
    if (!port) { slog("pick a port first", true); return; }
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let url = proto + "//" + location.host + "/serial/ws?port=" + encodeURIComponent(port) + "&baud=" + encodeURIComponent(baud);
    if (token) url += "&token=" + encodeURIComponent(token);
    let sock;
    try { sock = new WebSocket(url); }
    catch (e) { slog("cannot open socket", true); return; }
    sock.binaryType = "arraybuffer";
    SER.socket = sock;
    connBtn.textContent = "…";
    sock.onmessage = ev => {
      if (typeof ev.data === "string") {
        try {
          const j = JSON.parse(ev.data);
          if (j.error) { slog(j.error, true); try { sock.close(); } catch (e2) {} return; }
          if (j.open) { setConn(true); slog("connected: " + j.open); return; }
        } catch (e) {}
        slog(ev.data);
        return;
      }
      slogRaw(new TextDecoder().decode(new Uint8Array(ev.data)));
    };
    const dead = () => {
      if (SER.socket === sock) {
        SER.socket = null;
        setConn(false);
        slog("disconnected");
      }
    };
    sock.onclose = dead;
    sock.onerror = dead;
  };
  function doSend() {
    if (!inp.value || !SER.connected || !SER.socket) return;
    try {
      SER.socket.send(new TextEncoder().encode(inp.value + (nlBox.checked ? "\n" : "")));
    } catch (e) { slog(String(e), true); }
    inp.value = "";
  }
  sendBtn.onclick = doSend;
  inp.onkeydown = e => { if (e.key === "Enter") doSend(); };
  row.appendChild(portSel);
  row.appendChild(baudSel);
  row.appendChild(refBtn);
  row.appendChild(connBtn);
  row.appendChild(nl);
  sendRow.appendChild(inp);
  sendRow.appendChild(sendBtn);
  wrap.appendChild(row);
  wrap.appendChild(out);
  wrap.appendChild(sendRow);
  body.appendChild(wrap);
  loadPorts();
  if (SER.socket && SER.socket.readyState === 1) {
    setConn(true);
    slog("reattached (history clears on tab switch)");
  } else {
    setConn(false);
  }
}

function setBottomTab(t, silent) {
  S.bottomTab = t;
  document.querySelectorAll("#bottom .docktabs button").forEach(b => {
    b.classList.toggle("sel", b.dataset.btab === t);
  });
  if (!S.docks.bottom) toggleDock("bottom", true);
  if (silent) return;
  if (t === "problems") renderProblems();
  else if (t === "tasks") showTasks();
  else if (t === "search") runSearch();
  else if (t === "terminal") showTerminal();
  else if (t === "serial") showSerial();
  else renderConsole();
}

/* ============ docks ============ */
function toggleDock(which, force) {
  const on = force !== undefined ? force : !S.docks[which];
  S.docks[which] = on;
  document.getElementById(which === "bottom" ? "bottom" : which).classList.toggle("hidden", !on);
  const tb = document.getElementById("t-" + which);
  if (tb) { tb.classList.toggle("on", on); tb.classList.toggle("off", !on); }
  saveLayout();
  moveDockIndicator();
  applyLayout();
}
function moveDockIndicator() {
  const bar = document.querySelector("#left .docktabs");
  if (!bar) return;
  let ind = bar.querySelector(".kslide");
  if (!ind) {
    ind = document.createElement("span");
    ind.className = "kslide";
    bar.appendChild(ind);
  }
  const sel = bar.querySelector("button.sel");
  if (!sel || !S.docks.left) { ind.style.opacity = "0"; return; }
  ind.style.opacity = "1";
  ind.style.left = sel.offsetLeft + "px";
  ind.style.width = sel.offsetWidth + "px";
}
function setLeftTab(t) {
  document.querySelectorAll("#left .docktabs button").forEach(b => {
    b.classList.toggle("sel", b.dataset.ltab === t);
  });
  moveDockIndicator();
  const body = document.getElementById("leftbody");

  else {
    body.innerHTML = "";

    input.onkeydown = e => {

/* ============ clipboard ============ */
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function parentDir(p) {
  const r = rel(p);
  const i = r.lastIndexOf("/");
  return i < 0 ? "" : r.slice(0, i);
}

/* ============ context menu ============ */
function hideMenu() {

function askInput(opts) {
  return new Promise(resolve => {
    const wrap = document.getElementById("modalwrap");
    const modal = document.getElementById("modal");
    modal.innerHTML = "";
    const h = document.createElement("h3");
    h.textContent = opts.title;
    const input = document.createElement("input");
    input.placeholder = opts.placeholder || "";
    input.value = opts.value || "";
    input.spellcheck = false;
    input.autocomplete = "off";
    const row = document.createElement("div");
    row.className = "row";
    const cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    const ok = document.createElement("button");
    ok.textContent = opts.okLabel || "Create";
    if (opts.danger) ok.classList.add("danger");
    else ok.classList.add("primary");
    const close = v => {
      wrap.classList.remove("open");
      wrap.onclick = null;
      resolve(v);
    };
    ok.onclick = () => {
      const v = input.value.trim();
      close(v ? v : null);
    };
    cancel.onclick = () => close(null);
    input.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); ok.onclick(); }
      else if (e.key === "Escape") close(null);
      e.stopPropagation();
    };
    wrap.onclick = () => close(null);
    modal.onclick = e => e.stopPropagation();
    row.appendChild(cancel);
    row.appendChild(ok);
    modal.appendChild(h);
    modal.appendChild(input);
    modal.appendChild(row);
    wrap.classList.add("open");
    input.focus();
    input.select();
  });
}
function askConfirm(opts) {

    const wrap = document.getElementById("modalwrap");
    const modal = document.getElementById("modal");
    modal.innerHTML = "";
    const h = document.createElement("h3");
    h.textContent = opts.title;

    p.textContent = opts.body || "";

    row.className = "row";
    const cancel = document.createElement("button");
    cancel.textContent = "Cancel";
    const ok = document.createElement("button");
    ok.textContent = opts.okLabel || "Delete";
    ok.classList.add("danger");
    const close = v => {
      wrap.classList.remove("open");
      wrap.onclick = null;
      resolve(v);
    };
    ok.onclick = () => close(true);
    cancel.onclick = () => close(false);
    modal.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); close(true); }
      else if (e.key === "Escape") close(false);
      e.stopPropagation();
    };
    modal.tabIndex = 0;
    wrap.onclick = () => close(false);
    modal.onclick = e => e.stopPropagation();
    row.appendChild(cancel);
    row.appendChild(ok);
    modal.appendChild(h);
    modal.appendChild(p);
    modal.appendChild(row);
    wrap.classList.add("open");
    modal.focus();
  });
}

/* ============ fs ops from the tree ============ */
function trackTabForFs(oldAbs, makeNew) {
  // returns {closed: [...]} — caller refreshes tree first
  for (const g of S.groups) {
    for (let i = g.tabs.length - 1; i >= 0; i--) {
      const t = g.tabs[i];
      if (t.path !== oldAbs && !t.path.startsWith(oldAbs + "/")) continue;
      if (makeNew === null) {
        g.tabs.splice(i, 1);
        if (g.active >= g.tabs.length) g.active = g.tabs.length - 1;
      } else {
        t.path = makeNew(t.path);
        t.label = null;
      }
    }
  }
  const g = G();
  if (g.tabs.length === 0) {
    g.active = -1;
    if (ED) ED.setDoc("");
    renderTabs();
  } else {
    if (g.active < 0) g.active = 0;
    activateTab(g.active);
  }
}
async function fsOp(op, body, after) {
  try {
    const j = await post(op, body);
    if (!j.ok) throw new Error(j.error || "failed");
    if (after) await after(j);
    await loadFiles();
    refreshGitCounts();
  } catch (e) { msg(String(e), true); }
}
function fileMenu(x, y, absPath, isDir) {
  const r = rel(absPath);
  const isRoot = !r;
  const items = [];
  const dir = isDir ? r : parentDir(absPath);
  items.push({ label: "New File", run: async () => {
    const name = await askInput({ title: "New file" + (dir ? " in " + dir : ""), placeholder: "name.ext" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: false });
  }});
  items.push({ label: "New Folder", run: async () => {
    const name = await askInput({ title: "New folder" + (dir ? " in " + dir : ""), placeholder: "name" });
    if (name) fsOp("/fs/create", { path: dir ? dir + "/" + name : name, dir: true });
  }});
  if (isRoot) {
    items.push({ sep: true });
    items.push({ label: "Refresh", run: () => loadFiles() });
    items.push({ label: "Copy Root Path", run: () => copyText(absPath) });
    showMenu(x, y, items);
    return;
  }
  items.push({ sep: true });
  if (!isDir) {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop();
      const name = await askInput({ title: "Rename", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = dir ? dir + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
    items.push({ label: "Duplicate", run: () => fsOp("/fs/duplicate", { path: r }) });
  } else {
    items.push({ label: "Rename", run: async () => {
      const base = r.split("/").pop() || r;
      const name = await askInput({ title: "Rename folder", value: base, okLabel: "Rename" });
      if (name && name !== base) {
        const to = parentDir(absPath) ? parentDir(absPath) + "/" + name : name;
        await fsOp("/fs/rename", { from: r, to });
        await renameTabs(absPath, to);
      }
    }});
  }
  items.push({ label: "Delete", danger: true, run: async () => {
    const ok = await askConfirm({ title: "Delete " + (isDir ? "folder" : "file") + "?", body: r + (isDir ? " and everything inside it" : "") });
    if (ok) {
      await fsOp("/fs/delete", { path: r });
      trackTabForFs(absPath, null);
    }
  }});
  items.push({ sep: true });
  items.push({ label: "Copy Path", run: () => copyText(absPath) });
  items.push({ label: "Copy Relative Path", run: () => copyText(r) });
  if (!isDir) {
    items.push({ label: "Reveal in Tree", run: () => revealInTree(absPath) });
  } else {
    items.push({ label: "Refresh", run: () => loadFiles() });
  }
  showMenu(x, y, items);
}
async function renameTabs(oldAbs, newRel) {
  // server paths are absolute; rebuild tab path from the new relative path
  const ws = wsRoot ? wsRoot + "/" : "";
  for (const g of S.groups) {
    for (const t of g.tabs) {
      if (t.path === oldAbs || t.path.startsWith(oldAbs + "/")) {
        const suffix = t.path.slice(oldAbs.length);
        t.path = ws + newRel + suffix;
      }
    }
  }
  const g = G();
  if (g.active >= 0) activateTab(g.active);
  else renderTabs();
}

async function refreshGitCounts() {
  try {
    const list = await get("/git/status");
    const entries = list.entries || [];
    let staged = 0, unstaged = 0;
    S.gitStatus = {};
    entries.forEach(e => {
      if (e.staged && e.staged !== " " && e.staged !== "?") staged++;
      if (e.unstaged && e.unstaged !== " ") unstaged++;
      S.gitStatus[e.path] = (e.staged || " ") + (e.unstaged || " ");
    });
    document.getElementById("sgit").textContent =
      entries.length ? ("git +" + staged + " ~" + unstaged) : "git clean";
    if (S.leftTab === "project" && S.docks.left && S.files.length) {
      const box = document.getElementById("leftbody");
      if (box) {
        box.innerHTML = "";
        renderTree(box, buildTree(S.files), 0, "");
      }
    }
  } catch (e) {
    document.getElementById("sgit").textContent = "";
  }
}

async function loadScm() {

  stashRow.style.cssText = "display:flex;gap:6px;";

  stashBtn.onclick = async () => {
    const m = await askInput({ title: "Stash message (optional)", placeholder: "wip", okLabel: "Stash" });
    if (m === null) return;
    try {
      const j = await post("/git/stash", { message: m || "" });
      if (!j.ok) throw new Error(j.error || "failed");
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  };
  const popBtn = document.createElement("button");
  popBtn.className = "mini";
  popBtn.textContent = "pop stash";
  popBtn.onclick = async () => {
    try {
      const j = await post("/git/stash", { pop: true });
      if (!j.ok) throw new Error(j.error || "failed");
      await reloadScm();
    } catch (e) { msg(String(e), true); }
  };
  stashRow.appendChild(stashBtn);
  stashRow.appendChild(popBtn);
  wrap.appendChild(stashRow);

  async function reloadScm() {

      const [st, br] = await Promise.all([get("/git/status"), get("/git/branches")]);
      const entries = st.entries || [];
      sel.innerHTML = "";
      (br.entries || []).forEach(b => {

      });
      sel.onchange = async () => {

          if (!j.ok) throw new Error(j.error || "failed");
          await reloadScm();
        } catch (e) { msg(String(e), true); }
      };
      wrap.querySelectorAll(".staged-sec,.changes-sec").forEach(el => el.remove());
      const staged = entries.filter(e => e.staged && e.staged !== " " && e.staged !== "?");
      const changes = entries.filter(e => e.unstaged && e.unstaged !== " ");
      const mkSec = (title, list, stagedFlag) => {

        if (!list.length) {
          const em = document.createElement("div");
          em.className = "logline";
          em.textContent = stagedFlag ? "(nothing staged)" : "(working tree clean)";
          sec.appendChild(em);
        }
        list.forEach(e => {
          scmFileRow(sec, e, stagedFlag, stagedFlag
            ? [["−", "unstage", async () => {
                const j = await post("/git/unstage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }]]
            : [["+", "stage", async () => {
                const j = await post("/git/stage", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
              }], ["⟲", "discard changes", async () => {
                const ok = await askConfirm({ title: "Discard changes?", body: e.path, okLabel: "Discard" });
                if (!ok) return;
                const j = await post("/git/discard", { path: e.path });
                if (!j.ok) throw new Error(j.error || "failed");
                await reloadScm();
                loadFiles();
              }]]);
        });
        wrap.appendChild(sec);
      };
      mkSec("staged", staged, true);
      mkSec("changes", changes, false);
      refreshGitCounts();
      health();
    } catch (e) { msg(String(e), true); }
  }
  await reloadScm();
}

const FIND = { open: false, matches: [], cur: -1, matchCase: false };

function closeFind() {
  document.getElementById("findcard").classList.remove("open");

  if (S.marks) S.marks.find = [];
  for (const ed of ED_ALL) {

  }

function runFind() {
  const t = A();
  if (!t || !ED) return;
  const needle = document.getElementById("findneedle").value;
  const text = ED.getDoc();
  FIND.matches = [];
  FIND.cur = -1;
  if (needle) {
    const hay = FIND.matchCase ? text : text.toLowerCase();
    const nd = FIND.matchCase ? needle : needle.toLowerCase();
    let i = 0;
    while (FIND.matches.length < 2000) {
      i = hay.indexOf(nd, i);
      if (i < 0) break;
      FIND.matches.push({ from: i, to: i + nd.length, cur: false });
      i += Math.max(1, nd.length);
    }
    if (FIND.matches.length) FIND.cur = 0;
  }

}
function paintFind() {
  const n = FIND.matches.length;
  const needle = document.getElementById("findneedle").value;
  document.getElementById("findcount").textContent = n ? FIND.cur + 1 + "/" + n : needle ? "0" : "";
  FIND.matches.forEach((m, i) => { m.cur = i === FIND.cur; });
  const t = A();
  if (t && ED) {
    if (!S.marks || S.marks.path !== t.path) {
      S.marks = { path: t.path, spans: [], hunks: [], untracked: false, diags: [], find: [] };
    }
    S.marks.find = FIND.matches;
    for (const ed of ED_ALL) {
      if (ed && ed.remark) { try { ed.remark(); } catch (e) {} }
    }
    if (FIND.cur >= 0 && ED.sel) {
      const m = FIND.matches[FIND.cur];
      try { ED.sel(m.from, m.to - m.from); } catch (e) {}
    }
  }
}
function findStep(d) {
  if (!FIND.matches.length) return;
  FIND.cur = (FIND.cur + d + FIND.matches.length) % FIND.matches.length;
  paintFind();
}
function findReplaceOne() {
  const t = A();
  if (!t || !ED || FIND.cur < 0 || !FIND.matches[FIND.cur]) return;
  const m = FIND.matches[FIND.cur];
  const rep = document.getElementById("findrepl").value;
  if (ED.cm) {
    ED.view.dispatch({ changes: { from: m.from, to: m.to, insert: rep } });
  } else {
    const v = ED.getDoc();
    ED.setDoc(v.slice(0, m.from) + rep + v.slice(m.to));
  }
  markDirty(true);
  scheduleMarks();
  runFind();
}
function findReplaceAll() {
  const t = A();
  if (!t || !ED || !FIND.matches.length) return;
  const rep = document.getElementById("findrepl").value;
  const text = ED.getDoc();
  let out = "", last = 0;
  for (const m of FIND.matches) {
    out += text.slice(last, m.from) + rep;
    last = m.to;
  }
  out += text.slice(last);

  markDirty(true);
  scheduleMarks();
  runFind();
}
function wireFind() {
  const needle = document.getElementById("findneedle");
  needle.addEventListener("input", runFind);
  needle.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
  });
  document.getElementById("findrepl").addEventListener("keydown", e => {

    else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
  });
  document.getElementById("findclose").onclick = closeFind;
  document.getElementById("findnext").onclick = () => findStep(1);

  } else if (mod && e.key.toLowerCase() === "s") {
    if (document.activeElement && document.activeElement.id !== "editorwrap" && !document.activeElement.classList.contains("cm-content")) {
      e.preventDefault();
      saveActive();
    }
  } else if (mod && e.key === "\\") { e.preventDefault(); toggleSplit(); }
  else if (e.key === "Escape") {
    if (FIND.open) closeFind();
    else if (document.getElementById("palwrap").classList.contains("open")) palClose();
    else if (document.getElementById("settingswrap").classList.contains("open")) toggleSettings(false);
    else hideSuggest();
  }
});

/* ============ splits ============ */
async function toggleSplit() {
  const col1 = document.getElementById("col1");
  const split = !col1.classList.contains("hidden");
  if (split) {
    col1.classList.add("hidden");
    S.focus = 0;
    ED = ED_ALL[0];
    renderTabs();
  } else {
    col1.classList.remove("hidden");
    ensureGroup(1);
    if (!ED2 && ED_ALL[0] && ED_ALL[0].cm) {
      ED2 = await makeEditor(document.getElementById("editorwrap1"), 1);
      ED_ALL[1] = ED2;
    }
    focusGroup(1);
  }
}
function focusGroup(i) {
  S.focus = i;
  ED = ED_ALL[i] || ED_ALL[0];
  document.getElementById("col0").classList.toggle("focus", i === 0);
  document.getElementById("col1").classList.toggle("focus", i === 1);
  renderTabs();
  refreshEmpty();
  const t = A();
  if (t) activateTab(G().active);
}

/* ============ boot ============ */
(async function boot() {
  loadLayout();
  toggleDock("left", S.docks.left);
  toggleDock("right", S.docks.right);
  toggleDock("bottom", S.docks.bottom);
  const m = /[?&]token=([^&]*)/.exec(location.search);
  if (m) {
    token = decodeURIComponent(m[1]);
    try { localStorage.setItem(tokenKey(), token); } catch (e) {}
  } else {
    try { token = localStorage.getItem(tokenKey()) || ""; } catch (e) {}
  }
  updateLock();
  await bootEditor();
  applySettings();
  document.getElementById("col0").addEventListener("mousedown", () => { if (S.focus !== 0) focusGroup(0); });
  document.getElementById("col1").addEventListener("mousedown", () => { if (S.focus !== 1) focusGroup(1); });
  document.getElementById("t-settings").onclick = () => toggleSettings();
  document.getElementById("settings-close").onclick = () => toggleSettings(false);
  wireShell();
  wireFind();
  initSplitters();
  health();
  await loadFiles();
  renderProblems();
  log("console", "keplr web ui ready");
  requestAnimationFrame(moveDockIndicator);
  // Deep links for sharing/screenshots: ?open=path&line=12&bottom=terminal&left=source
  try {
    const q = new URLSearchParams(location.search);
    const left = q.get("left");
    if (left === "project" || left === "source") setLeftTab(left);
    const bottom = q.get("bottom");
    if (bottom) setBottomTab(bottom);
    const open = q.get("open");
    if (open) {
      const line = parseInt(q.get("line") || "0", 10) || 0;
      await openFile(open, line).catch(e => msg(String(e), true));
    }
  } catch (e) {}
})();
</script>
