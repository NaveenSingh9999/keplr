name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - name: Run browser-side tests when any exist
        run: |
          shopt -s nullglob
          tests=(crates/keplr-serve/tests/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; fi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace

  gpu-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p keplr-render --features gpu
      - run: cargo check -p keplr-cli --features desktop
      - run: cargo build -p keplr-cli --features desktop
      - run: ./target/debug/keplr --root . snapshot --open Cargo.toml --width 800 --height 600 --out /tmp/shot.png || echo "no GPU on runner"
      - uses: actions/upload-artifact@v4
        if: hashFiles('/tmp/shot.png') != ''
        with:
          name: render-snapshot
          path: /tmp/shot.png

  laml-bridge:
    name: laml event bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a C++20 compiler for the source fallback
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang make
      - name: Fetch the LAML interpreter Keplr ships with
        run: ./scripts/fetch-laml.sh
      - name: The service program starts and announces its port
        run: |
          set -euo pipefail
          LAM=$(ls assets/laml/laml-linux-* | head -1)
          chmod +x "$LAM"
          output=$(timeout 5 "$LAM" run crates/keplr-events/src/events.lm 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "keplr events on 18787"
      - name: The bridge talks to the real service
        run: cargo test -p keplr-events -- --nocapture

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p keplr-lang -p keplr-sync -p keplr-build -p keplr-core -p keplr-render -p keplr-ui --target wasm32-unknown-unknown

  wasm-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli
      - run: cargo build -p keplr-web --target wasm32-unknown-unknown --release
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/keplr_web.wasm --out-dir /tmp/keplr-web --target web
      - run: ls -la /tmp/keplr-web && test -f /tmp/keplr-web/keplr_web_bg.wasm

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p keplr-cli -- --root /tmp/benchroot bench --files 200 --lines 20 --json

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p keplr-cli --all-targets
      - run: cargo clippy -p keplr-cli --all-targets -- -D warnings

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test -p keplr-cli --bin keplr
