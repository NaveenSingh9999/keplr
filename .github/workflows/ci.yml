name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - name: Run browser-side tests when any exist
        run: |
          shopt -s nullglob
          tests=(crates/keplr-serve/tests/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; fi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace

  gpu-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver
        # The runner has no GPU, and wgpu will not render a frame without an
        # adapter. Mesa's lavapipe is a Vulkan device on the CPU, so the
        # snapshot below draws the real pipeline output rather than skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1
      - run: cargo check -p keplr-render --features gpu
      - run: cargo check -p keplr-cli --features desktop
      - run: cargo build -p keplr-cli --features desktop
      - name: Render a snapshot
        run: ./target/debug/keplr --root . snapshot --open Cargo.toml --width 800 --height 600 --out /tmp/shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: render-snapshot
          path: /tmp/shot.png

  native-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the system libraries a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-cursor-dev libxcb-shape0-dev \
            libxcb-render0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Install a software Vulkan driver
        # There is no GPU on a runner, and wgpu will not draw a frame without an
        # adapter. Mesa's lavapipe is a Vulkan device on the CPU, so the window
        # is really rendered rather than skipped.
        run: |
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1
      - run: cargo build -p keplr-native
      - name: Print the solved layout
        # The numbers behind the pictures: which box is where, and how big. A
        # layout mistake and a paint mistake look the same in a dark screenshot.
        run: ./target/debug/keplr-native --snapshot --out /tmp/shots/keplr.png --layout --pane terminal .
      - name: Draw every pane
        run: ./target/debug/keplr-native --snapshot --out /tmp/shots/keplr.png .
      - uses: actions/upload-artifact@v4
        with:
          name: native-snapshots
          path: /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout
          path: /tmp/layout.txt

  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p keplr-lang -p keplr-sync -p keplr-build -p keplr-core -p keplr-render -p keplr-ui --target wasm32-unknown-unknown

  wasm-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli
      - run: cargo build -p keplr-web --target wasm32-unknown-unknown --release
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/keplr_web.wasm --out-dir /tmp/keplr-web --target web
      - run: ls -la /tmp/keplr-web && test -f /tmp/keplr-web/keplr_web_bg.wasm

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p keplr-cli -- --root /tmp/benchroot bench --files 200 --lines 20 --json

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p keplr-cli --all-targets
      - run: cargo clippy -p keplr-cli --all-targets -- -D warnings

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test -p keplr-cli --bin keplr
