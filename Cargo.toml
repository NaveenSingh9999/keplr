[workspace]
members = ["crates/keplr-core", "crates/keplr-sync", "crates/keplr-build", "crates/keplr-lang", "crates/keplr-serve", "crates/keplr-cli", "crates/keplr-render", "crates/keplr-ui", "crates/keplr-web", "crates/keplr-theme"]

[profile.release]
strip = "symbols"
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.95"
thiserror = "1.0.69"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["full"] }
axum = { version = "0.7.9", features = ["ws"] }
clap = { version = "4.5.21", features = ["derive"] }
ignore = "0.4.23"
walkdir = "2.5.0"
notify = "6.1.1"
blake3 = "1.5.5"
ropey = "1.6.1"
nucleo-matcher = "0.3.1"
yrs = "0.18.8"
crossterm = "0.28"
winit = "0.30"
wgpu = "22"
pollster = "0.3"
ab_glyph = "0.2"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
wasm-bindgen = "0.2"
web-sys = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
http = "1"
portable-pty = "0.9"
alacritty_terminal = "0.26"
